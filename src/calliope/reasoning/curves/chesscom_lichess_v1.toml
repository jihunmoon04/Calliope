# chess.com → Lichess rating conversion (Q-D §3.1), per chess.com pool. Anchors are
# (chess.com rating, Lichess rating) pairs; the runtime interpolates between them in integers and
# clamps strictly outside them. A survey estimate, not a measurement of play.

[conversion]
name = "chesscom_lichess_v1"
source = "https://chessiro.com/chess-rating-converter"
retrieved = "2026-10-10"
method = "anchor points measured from a survey of about 20 000 players active on both sites (rating deviation under 150); about half of players fall within the source's typical range"

