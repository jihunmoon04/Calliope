[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calliope-chess"
version = "0.1.0"
description = "Evidence-first chess explanation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-chess>=1.999",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calliope"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
