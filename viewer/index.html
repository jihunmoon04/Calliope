<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calliope Viewer</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --text: #1f2328; --muted: #6b6f76; --border: #dcd9d1;
  --hover: #f0eee8; --sel: #e3ecfb; --accent: #2f6fde;
  --sq-light: #ecdcb9; --sq-dark: #b08a62; --coord-light: #b08a62; --coord-dark: #ecdcb9;
  --last: rgba(244, 208, 63, 0.55); --ref: #e8590c; --ref-soft: rgba(232, 89, 12, 0.35);
  --eval-white: #f2f2f2; --eval-black: #3a3a3a; --eval-line: #8a8a8a;
  --eval-on-white: #1f2328; --eval-on-black: #f2f2f2;
  --best: #2e9d4f; --excellent: #64a83b; --good: #3b8f8a; --inaccuracy: #d4a017;
  --mistake: #e2742b; --blunder: #cf3030; --brilliant: #1a9fb5; --great: #3b6fd4;
  --miss: #c2410c; --forced: #7a7f87; --warn-bg: #fff4d6; --warn-text: #7a5300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #212328; --text: #e6e6e3; --muted: #9a9ea6; --border: #34373e;
    --hover: #2a2d33; --sel: #253450; --accent: #6d9cf0;
    --sq-light: #c9b48f; --sq-dark: #8a6a4a; --coord-light: #8a6a4a; --coord-dark: #c9b48f;
    --eval-white: #d9d9d9; --eval-black: #2b2d31; --warn-bg: #3b3220; --warn-text: #f2d48a;
    --eval-on-white: #17181b; --eval-on-black: #e6e6e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #212328; --text: #e6e6e3; --muted: #9a9ea6; --border: #34373e;
  --hover: #2a2d33; --sel: #253450; --accent: #6d9cf0;
  --sq-light: #c9b48f; --sq-dark: #8a6a4a; --coord-light: #8a6a4a; --coord-dark: #c9b48f;
  --eval-white: #d9d9d9; --eval-black: #2b2d31; --warn-bg: #3b3220; --warn-text: #f2d48a;
  --eval-on-white: #17181b; --eval-on-black: #e6e6e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}
header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
}
header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
header .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, .button {
  font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; cursor: pointer;
}
button:hover, .button:hover { background: var(--hover); }
button:disabled { opacity: 0.45; cursor: default; }
input[type="file"] { display: none; }
main {
  display: grid; grid-template-columns: minmax(280px, 560px) minmax(300px, 1fr); gap: 16px;
  padding: 16px; max-width: 1280px; margin: 0 auto;
}
@media (max-width: 860px) {
  /* one column: the explanation right under the board, the move list and the rest after it */
  main { grid-template-columns: 1fr; gap: 10px; padding-bottom: 76px; }
  .left, .right { display: contents; }
  #top { order: 1; } #preview { order: 2; } .board-wrap { order: 3; } #ply { order: 4; }
  #bottom { order: 5; } #graph { order: 6; } #moves { order: 7; } #summary { order: 8; }
  #meta { order: 9; }
  #moves { max-height: 260px; }
  .controls {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; flex-wrap: nowrap;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .controls button { flex: 1; min-width: 0; min-height: 42px; font-size: 16px; }
}
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
#empty { grid-column: 1 / -1; padding: 48px 24px; text-align: center; color: var(--muted); }
#empty code { background: var(--hover); padding: 2px 6px; border-radius: 4px; color: var(--text); }
#empty pre {
  display: inline-block; text-align: left; background: var(--hover); color: var(--text);
  padding: 10px 14px; border-radius: 6px; overflow-x: auto; max-width: 100%;
}
.drop { outline: 3px dashed var(--accent); outline-offset: -8px; }
#error { color: var(--blunder); font-weight: 600; }

.left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.players { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; }
.player { display: flex; align-items: center; gap: 8px; min-width: 0; }
.player .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
.player .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .rating { color: var(--muted); }
#preview {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-height: 38px;
  font-size: 14px; border-color: var(--ref);
}
#preview .caption { flex: 1; min-width: 0; }
#preview .caption b { color: var(--ref); }
#preview[hidden] { display: none; }
.board-wrap { display: flex; gap: 6px; align-items: stretch; }
#board { flex: 1; min-width: 0; }
#board svg { display: block; width: 100%; height: auto; border-radius: 6px; }
#evalbar {
  position: relative; width: 24px; flex: none; overflow: hidden; border-radius: 4px;
  background: var(--eval-black); border: 1px solid var(--border);
}
#evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--eval-white); transition: height 0.25s ease; }
#evalbar.flipped .fill { bottom: auto; top: 0; }
#evalbar .num {
  position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -0.3px;
}
@media (prefers-reduced-motion: reduce) { #evalbar .fill { transition: none; } }
.controls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.controls button { min-width: 44px; }
#graph svg { display: block; width: 100%; height: 110px; cursor: pointer; }
#graph { padding: 6px; }

.right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
#ply { padding: 14px 16px; }
#ply h2 { margin: 0 0 6px; font-size: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: 13px; font-weight: 650; color: #fff;
}
.badge.provisional::after { content: "잠정"; font-weight: 500; opacity: 0.85; font-size: 11px; }
.evalline { color: var(--muted); font-size: 14px; margin-top: 8px; }
.evalline b { color: var(--text); font-variant-numeric: tabular-nums; }
#text { font-size: 16px; line-height: 1.65; }
#text .seg { border-radius: 3px; }
#text .seg.has-refs { cursor: pointer; text-decoration: underline dotted var(--ref); text-underline-offset: 3px; }
#text .seg.has-refs:hover, #text .seg.active { background: var(--ref-soft); }
#text .seg.judgement { font-weight: 650; }
#text .seg.scope { color: var(--muted); font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
details.claims { margin-top: 10px; font-size: 13px; color: var(--muted); }
details.claims li { margin: 2px 0; }

#moves { max-height: 420px; overflow-y: auto; padding: 4px 0; }
#moves table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
#moves td { padding: 2px 6px; }
#moves td.no { color: var(--muted); width: 42px; text-align: right; }
#moves .mv { cursor: pointer; border-radius: 4px; padding: 2px 6px; display: inline-flex; gap: 6px; align-items: center; }
#moves .mv:hover { background: var(--hover); }
#moves .mv.current { background: var(--sel); font-weight: 650; }
#moves .mv.unanalysed { color: var(--muted); }
.sym { font-size: 12px; font-weight: 700; min-width: 16px; text-align: center; }

#summary { padding: 10px 12px; font-size: 13px; overflow-x: auto; }
#summary table { border-collapse: collapse; width: 100%; }
#summary th, #summary td { padding: 2px 6px; text-align: center; }
#summary th:first-child, #summary td:first-child { text-align: left; }
#meta { padding: 10px 12px; font-size: 12px; color: var(--muted); }
.warn { background: var(--warn-bg); color: var(--warn-text); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Calliope Viewer</h1>
  <div class="actions">
    <span id="filename" class="hint"></span>
    <label class="button" for="file">결과 파일 열기</label>
    <input type="file" id="file" accept=".json,application/json">
    <button id="theme" title="테마 전환">테마</button>
  </div>
</header>

<main id="app">
  <section id="empty" class="panel">
    <p><b>calliope_result_v1</b> JSON 파일을 열거나 이 창에 끌어다 놓으세요.</p>
    <pre>CALLIOPE_STOCKFISH_PATH=… PYTHONPATH=. python -m tools.explain_game game.pgn --json game.json</pre>
    <p>서버로 띄웠다면 <code>?file=경로/game.json</code> 으로 바로 열 수도 있습니다.</p>
    <p id="error"></p>
  </section>
</main>

<script>
"use strict";

// -- pure part: positions, references, formatting (tested with node: tests/viewer) -------------

const FILES = "abcdefgh";
const GRADES = {
  best: { ko: "최선", sym: "★" }, excellent: { ko: "우수", sym: "✦" }, good: { ko: "좋음", sym: "✓" },
  inaccuracy: { ko: "부정확", sym: "?!" }, mistake: { ko: "실수", sym: "?" }, blunder: { ko: "블런더", sym: "??" },
};
const LABELS = {
  brilliant: { ko: "브릴리언트", sym: "!!" }, great: { ko: "그레이트", sym: "!" },
  miss: { ko: "미스", sym: "✗" }, forced: { ko: "강제", sym: "□" },
};
const PIECE_KO = { king: "킹", queen: "퀸", rook: "룩", bishop: "비숍", knight: "나이트", pawn: "폰" };
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };

function squareIndex(sq) { return (8 - Number(sq[1])) * 8 + FILES.indexOf(sq[0]); }
function squareName(i) { return FILES[i % 8] + (8 - Math.floor(i / 8)); }

/** The 64 squares of a FEN's placement, a8 first; "" for an empty square. */
function parsePlacement(fen) {
  const out = [];
  for (const row of fen.split(" ")[0].split("/")) {
    for (const ch of row) {
      if (/\d/.test(ch)) for (let k = 0; k < Number(ch); k++) out.push("");
      else out.push(ch);
    }
  }
  if (out.length !== 64) throw new Error("bad FEN: " + fen);
  return out;
}

function placementKey(board) { return board.map((p) => p || ".").join(""); }

/** The board after a UCI move: castling moves the rook, en passant removes the pawn. */
function applyUci(board, uci) {
  const b = board.slice();
  const from = squareIndex(uci.slice(0, 2)), to = squareIndex(uci.slice(2, 4));
  const piece = b[from];
  if (!piece) throw new Error("no piece on " + uci.slice(0, 2));
  const white = piece === piece.toUpperCase();
  const df = (to % 8) - (from % 8);
  if (piece.toLowerCase() === "k" && Math.abs(df) === 2) {
    const rank = Math.floor(from / 8) * 8;
    const [rf, rt] = df > 0 ? [rank + 7, rank + 5] : [rank, rank + 3];
    b[rt] = b[rf]; b[rf] = "";
  }
  if (piece.toLowerCase() === "p" && df !== 0 && !b[to]) {
    b[Math.floor(from / 8) * 8 + (to % 8)] = "";  // en passant: the pawn beside the mover
  }
  b[to] = uci.length > 4 ? (white ? uci[4].toUpperCase() : uci[4].toLowerCase()) : piece;
  b[from] = "";
  return b;
}

/** Every position of the game: index k is the board after k plies. */
function gamePositions(doc) {
  const out = [parsePlacement(doc.game.start_fen)];
  for (const m of doc.game.moves) out.push(applyUci(out[out.length - 1], m.uci));
  return out;
}

function fenMover(fen) {
  const f = fen.split(" ");
  return { white: f[1] === "w", fullmove: Number(f[5] || 1) };
}

function numbered(fen, san) {
  const m = fenMover(fen);
  return m.white ? `${m.fullmove}.${san}` : `${m.fullmove}...${san}`;
}

/** SAN of a line, numbered from its start FEN; `upto` marks the move shown on the board. */
function lineText(fen, moves, truncated, upto) {
  let { white, fullmove } = fenMover(fen);
  const parts = moves.map((m, i) => {
    const text = i === 0 || white ? (white ? `${fullmove}.${m.san}` : `${fullmove}...${m.san}`) : m.san;
    if (!white) fullmove += 1;
    white = !white;
    return i === upto ? `<b>${esc(text)}</b>` : esc(text);
  });
  return parts.join(" ") + (truncated ? " …" : "");
}

/** Board frames a reference draws (AR-D §4: each in its own position). */
function refFrames(ref) {
  if (ref.kind === "piece") {
    const side = ref.color === "white" ? "백" : "흑";
    return [{ board: parsePlacement(ref.fen), rings: [ref.square], arrows: [],
              caption: esc(`${side} ${PIECE_KO[ref.piece] || ref.piece} ${ref.square}`) }];
  }
  if (ref.kind === "square") {
    return [{ board: parsePlacement(ref.fen), rings: [ref.square], arrows: [], caption: esc(ref.square) }];
  }
  if (ref.kind === "move") {
    return [{ board: applyUci(parsePlacement(ref.fen), ref.uci), rings: [],
              arrows: [[ref.uci.slice(0, 2), ref.uci.slice(2, 4)]], caption: esc(numbered(ref.fen, ref.san)) }];
  }
  if (ref.kind === "line") {
    const frames = [];
    let board = parsePlacement(ref.fen);
    ref.moves.forEach((m, i) => {
      board = applyUci(board, m.uci);
      frames.push({ board, rings: [], arrows: [[m.uci.slice(0, 2), m.uci.slice(2, 4)]],
                    caption: lineText(ref.fen, ref.moves, ref.truncated, i) });
    });
    return frames;
  }
  return [];
}

/** A segment's frames: consecutive frames of one position are drawn together. */
function segmentFrames(refs) {
  const out = [];
  for (const frame of refs.flatMap(refFrames)) {
    const last = out[out.length - 1];
    if (last && placementKey(last.board) === placementKey(frame.board)) {
      const rings = frame.rings.filter((r) => !last.rings.includes(r));
      const arrows = frame.arrows.filter((a) => !last.arrows.some((b) => b[0] === a[0] && b[1] === a[1]));
      last.rings = last.rings.concat(rings);
      last.arrows = last.arrows.concat(arrows);
      // a frame that adds nothing (a line's first move after the same move) keeps the fuller caption
      last.caption = rings.length || arrows.length ? `${last.caption} · ${frame.caption}` : frame.caption;
    } else {
      out.push({ ...frame });
    }
  }
  return out;
}

function scoreText(score) {
  if (!score) return "–";
  if ("mate" in score) return (score.mate > 0 ? "M" : "−M") + Math.abs(score.mate);
  const v = score.cp / 100;
  return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
}

/** White's advantage in [-1, 1]: a logistic of the centipawns, ±1 for a mate. */
function scoreValue(score) {
  if ("mate" in score) return score.mate > 0 ? 1 : -1;
  return 2 / (1 + Math.exp(-0.004 * score.cp)) - 1;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** The board as SVG; `opts`: flipped, last [from, to], rings [sq], arrows [[from, to]]. */
function boardSvg(board, opts = {}) {
  const S = 60, out = [];
  const xy = (sq) => {
    const i = squareIndex(sq);
    let c = i % 8, r = Math.floor(i / 8);
    if (opts.flipped) { c = 7 - c; r = 7 - r; }
    return [c * S, r * S];
  };
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${8 * S} ${8 * S}" role="img" aria-label="board">`);
  out.push(`<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ref)"/></marker></defs>`);
  for (let i = 0; i < 64; i++) {
    const sq = squareName(i), [x, y] = xy(sq);
    const light = ((i % 8) + Math.floor(i / 8)) % 2 === 0;
    out.push(`<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="var(${light ? "--sq-light" : "--sq-dark"})"/>`);
    if (opts.last && opts.last.includes(sq)) out.push(`<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="var(--last)"/>`);
  }
  for (let k = 0; k < 8; k++) {  // coordinates on the bottom rank and the left file
    const file = opts.flipped ? FILES[7 - k] : FILES[k], rank = opts.flipped ? k + 1 : 8 - k;
    const lightFile = (k + 7) % 2 === 0, lightRank = k % 2 === 0;
    out.push(`<text x="${k * S + S - 4}" y="${8 * S - 4}" font-size="11" text-anchor="end" fill="var(${lightFile ? "--coord-light" : "--coord-dark"})">${file}</text>`);
    out.push(`<text x="3" y="${k * S + 12}" font-size="11" fill="var(${lightRank ? "--coord-light" : "--coord-dark"})">${rank}</text>`);
  }
  for (const sq of opts.rings || []) {
    const [x, y] = xy(sq);
    out.push(`<circle cx="${x + S / 2}" cy="${y + S / 2}" r="${S / 2 - 3}" fill="none" stroke="var(--ref)" stroke-width="4"/>`);
  }
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (!p) continue;
    const [x, y] = xy(squareName(i));
    const white = p === p.toUpperCase();
    out.push(`<text x="${x + S / 2}" y="${y + S * 0.8}" font-size="${S * 0.78}" text-anchor="middle" ` +
      `font-family="'DejaVu Sans','Segoe UI Symbol','Noto Sans Symbols2','Apple Symbols',serif" ` +
      `fill="${white ? "#fafafa" : "#1b1b1b"}" stroke="${white ? "#1b1b1b" : "#fafafa"}" stroke-width="${white ? 1.6 : 0.6}" ` +
      `paint-order="stroke">${GLYPH[p.toLowerCase()]}︎</text>`);
  }
  for (const [from, to] of opts.arrows || []) {
    const [x1, y1] = xy(from), [x2, y2] = xy(to);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, cut = S * 0.32;
    out.push(`<line x1="${x1 + S / 2}" y1="${y1 + S / 2}" x2="${x2 + S / 2 - (dx / len) * cut}" y2="${y2 + S / 2 - (dy / len) * cut}" ` +
      `stroke="var(--ref)" stroke-width="${S * 0.16}" stroke-linecap="round" opacity="0.85" marker-end="url(#ah)"/>`);
  }
  out.push("</svg>");
  return out.join("");
}

const CalliopeViewer = { parsePlacement, applyUci, gamePositions, refFrames, segmentFrames, lineText,
                         scoreText, scoreValue, boardSvg, numbered, esc, placementKey };
if (typeof globalThis !== "undefined") globalThis.CalliopeViewer = CalliopeViewer;

// -- the page ----------------------------------------------------------------------------------

if (typeof document !== "undefined") {
  const state = { doc: null, positions: [], plies: new Map(), ply: 0, flipped: false, preview: null };
  const $ = (id) => document.getElementById(id);

  function load(doc, name) {
    if (!doc || doc.schema !== "calliope_result_v1") throw new Error("calliope_result_v1 문서가 아닙니다.");
    state.doc = doc;
    state.positions = gamePositions(doc);
    state.plies = new Map(doc.plies.map((p) => [p.ply, p]));
    state.ply = doc.plies.length ? doc.plies[0].ply : 0;
    state.preview = null;
    $("filename").textContent = name || "";
    layout();
    render();
  }

  function layout() {
    $("app").innerHTML = `
      <div class="left">
        <div class="panel players" id="top"></div>
        <div class="panel" id="preview" hidden></div>
        <div class="board-wrap"><div id="evalbar" title="평가 (백 기준)"></div><div id="board"></div></div>
        <div class="panel players" id="bottom"></div>
        <div class="controls">
          <button id="first" title="처음 (Home)">⏮</button><button id="prev" title="이전 (←)">◀</button>
          <button id="next" title="다음 (→)">▶</button><button id="last" title="끝 (End)">⏭</button>
          <button id="flip" title="판 뒤집기 (F)">⇅</button>
        </div>
        <div class="panel" id="graph"></div>
      </div>
      <div class="right">
        <div class="panel" id="ply"></div>
        <div class="panel" id="moves"></div>
        <div class="panel" id="summary"></div>
        <div class="panel" id="meta"></div>
      </div>`;
    $("first").onclick = () => go(0);
    $("prev").onclick = () => go(state.ply - 1);
    $("next").onclick = () => go(state.ply + 1);
    $("last").onclick = () => go(state.positions.length - 1);
    $("flip").onclick = () => { state.flipped = !state.flipped; renderBoard(); renderEvalBar(); renderPlayers(); };
    $("graph").onclick = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const n = state.doc.game.moves.length;
      go(Math.round(((e.clientX - r.left) / r.width) * n));
    };
    renderMoves(); renderSummary(); renderMeta();
  }

  function go(ply) {
    const n = state.positions.length - 1;
    state.ply = Math.max(0, Math.min(n, ply));
    state.preview = null;
    render();
    const cur = document.querySelector("#moves .mv.current");
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  function render() { renderPlayers(); renderBoard(); renderEvalBar(); renderPly(); renderGraph(); markCurrent(); }

  /** The bar beside the board: White's share from the bottom (from the top when flipped). */
  function renderEvalBar() {
    const p = state.plies.get(state.ply);
    const score = p && p.evaluation && p.evaluation.played;
    const share = score ? (scoreValue(score) + 1) / 2 : 0.5;
    const white = !score || share >= 0.5;
    const text = score ? scoreText(score).replace(/^[+−]/, "") : (state.ply ? "–" : "");
    // the number sits on the side that is ahead, at the bar's end on that side
    const atBottom = white !== state.flipped;
    const pos = atBottom ? "bottom: 3px" : "top: 3px";
    const color = white ? "var(--eval-on-white)" : "var(--eval-on-black)";
    const bar = $("evalbar");
    bar.classList.toggle("flipped", state.flipped);
    bar.innerHTML = `<div class="fill" style="height:${(share * 100).toFixed(1)}%"></div>` +
      `<div class="num" style="${pos}; color:${color}">${esc(text)}</div>`;
    bar.title = score ? `평가 ${scoreText(score)} (백 기준)` : "평가 없음";
  }

  function renderPlayers() {
    const h = state.doc.game.headers;
    const one = (side) => `<div class="player"><span class="dot" style="background:${side === "white" ? "#fafafa" : "#1b1b1b"}"></span>` +
      `<span class="name">${esc(h[side] || (side === "white" ? "백" : "흑"))}</span>` +
      (h[side + "_rating"] ? `<span class="rating">(${h[side + "_rating"]})</span>` : "") + "</div>";
    const [top, bottom] = state.flipped ? ["white", "black"] : ["black", "white"];
    $("top").innerHTML = one(top) + `<span class="hint">${esc(h.result || "")}</span>`;
    $("bottom").innerHTML = one(bottom) + `<span class="hint">${esc([h.time_control, h.date].filter(Boolean).join(" · "))}</span>`;
  }

  function renderBoard() {
    const pv = state.preview;
    let svg;
    if (pv) {
      const f = pv.frames[pv.i];
      svg = boardSvg(f.board, { flipped: state.flipped, rings: f.rings, arrows: f.arrows });
      const steps = pv.frames.length > 1
        ? `<button id="pv-prev" ${pv.i === 0 ? "disabled" : ""}>◀</button><span class="hint">${pv.i + 1}/${pv.frames.length}</span>` +
          `<button id="pv-next" ${pv.i === pv.frames.length - 1 ? "disabled" : ""}>▶</button>` : "";
      $("preview").innerHTML = `<span class="caption">${f.caption}</span>${steps}<button id="pv-close" title="닫기 (Esc)">✕</button>`;
      $("preview").hidden = false;
      if ($("pv-prev")) $("pv-prev").onclick = () => step(-1);
      if ($("pv-next")) $("pv-next").onclick = () => step(1);
      $("pv-close").onclick = clearPreview;
    } else {
      const m = state.doc.game.moves[state.ply - 1];
      svg = boardSvg(state.positions[state.ply], { flipped: state.flipped, last: m ? [m.uci.slice(0, 2), m.uci.slice(2, 4)] : null });
      $("preview").hidden = true;
    }
    $("board").innerHTML = svg;
  }

  function badge(kind, info, provisional) {
    return `<span class="badge${provisional ? " provisional" : ""}" style="background:var(--${kind})">${esc(info.sym)} ${esc(info.ko)}</span>`;
  }

  function renderPly() {
    const el = $("ply");
    if (state.ply === 0) {
      el.innerHTML = `<h2>시작 위치</h2><div class="hint">▶ 버튼이나 기보를 눌러 수를 보세요. 해설에서 밑줄 친 부분을 누르면 판에 표시됩니다.</div>`;
      return;
    }
    const move = state.doc.game.moves[state.ply - 1];
    const p = state.plies.get(state.ply);
    const fen = p ? p.fen_before : null;
    const title = fen ? numbered(fen, move.san) : move.san;
    if (!p) {
      el.innerHTML = `<h2>${esc(title)}</h2><div class="hint">이 수는 분석되지 않았습니다.</div>`;
      return;
    }
    let head = `<h2>${esc(title)} `;
    if (p.grade) head += badge(p.grade, GRADES[p.grade]);
    if (p.label) head += badge(p.label.kind, LABELS[p.label.kind], p.label.provisional);
    head += "</h2>";
    const ev = p.evaluation;
    let evline = "";
    if (ev && ev.played && ev.best_move && ev.best_move.uci !== p.uci) {  // the number itself is in the bar
      evline = `<div class="evalline">둔 수 <b>${scoreText(ev.played)}</b> · 최선 ` +
        `<b>${esc(numbered(p.fen_before, ev.best_move.san))}</b> <b>${scoreText(ev.best)}</b></div>`;
    } else if (p.status === "inconclusive") {
      evline = `<div class="evalline">판정 보류: ${esc(p.reason || "")}</div>`;
    }
    const segs = p.segments.map((s, i) => {
      const cls = ["seg", s.source, s.refs.length ? "has-refs" : ""].join(" ");
      return `<span class="${cls}" data-i="${i}">${esc(s.text)}</span>`;
    }).join("");
    const claims = p.claims.map((c) => `<li>${esc(c.template)} — ${esc(c.role)}, ${esc(c.status)}${c.rendered ? " (본문)" : ""}</li>`).join("");
    el.innerHTML = head + `<div id="text">${segs}</div>` + evline +
      `<div class="hint">밑줄 친 부분: 마우스를 올리면 미리보기, 누르면 고정 (Esc로 해제)</div>` +
      (claims ? `<details class="claims"><summary>근거 주장 ${p.claims.length}개</summary><ul>${claims}</ul></details>` : "");
    el.querySelectorAll(".seg.has-refs").forEach((span) => {
      const seg = p.segments[Number(span.dataset.i)];
      span.onmouseenter = () => { if (!state.preview || !state.preview.pinned) setPreview(seg, span, false); };
      span.onmouseleave = () => { if (state.preview && !state.preview.pinned) clearPreview(); };
      span.onclick = () => {
        if (state.preview && state.preview.pinned && state.preview.span === span) clearPreview();
        else setPreview(seg, span, true);
      };
    });
  }

  function setPreview(seg, span, pinned) {
    const frames = segmentFrames(seg.refs);
    if (!frames.length) return;
    document.querySelectorAll("#text .seg.active").forEach((x) => x.classList.remove("active"));
    span.classList.add("active");
    state.preview = { frames, i: 0, pinned, span };
    renderBoard();
  }

  function clearPreview() {
    document.querySelectorAll("#text .seg.active").forEach((x) => x.classList.remove("active"));
    state.preview = null;
    renderBoard();
  }

  function step(d) {
    const pv = state.preview;
    pv.i = Math.max(0, Math.min(pv.frames.length - 1, pv.i + d));
    pv.pinned = true;
    renderBoard();
  }

  function symbolOf(p) {
    if (!p) return "";
    if (p.label) return `<span class="sym" style="color:var(--${p.label.kind})">${esc(LABELS[p.label.kind].sym)}</span>`;
    if (p.grade && p.grade !== "best" && p.grade !== "excellent" && p.grade !== "good")
      return `<span class="sym" style="color:var(--${p.grade})">${esc(GRADES[p.grade].sym)}</span>`;
    return "";
  }

  function renderMoves() {
    const moves = state.doc.game.moves;
    let { white, fullmove } = fenMover(state.doc.game.start_fen);
    const rows = [];
    let row = null;
    moves.forEach((m, i) => {
      const ply = i + 1, p = state.plies.get(ply);
      const cell = `<span class="mv${p ? "" : " unanalysed"}" data-ply="${ply}">${esc(m.san)}${symbolOf(p)}</span>`;
      if (white || !row) { row = { no: fullmove, w: white ? cell : "…", b: "" }; rows.push(row); if (!white) row.b = cell; }
      else row.b = cell;
      if (!white) fullmove += 1;
      white = !white;
    });
    $("moves").innerHTML = `<table>${rows.map((r) => `<tr><td class="no">${r.no}.</td><td>${r.w}</td><td>${r.b}</td></tr>`).join("")}</table>`;
    $("moves").querySelectorAll(".mv").forEach((el) => { el.onclick = () => go(Number(el.dataset.ply)); });
  }

  function markCurrent() {
    document.querySelectorAll("#moves .mv").forEach((el) => el.classList.toggle("current", Number(el.dataset.ply) === state.ply));
  }

  function renderGraph() {
    const n = state.doc.game.moves.length || 1, W = 600, H = 110, mid = H / 2;
    const pts = [];
    for (let ply = 1; ply <= n; ply++) {
      const p = state.plies.get(ply);
      pts.push(p && p.evaluation && p.evaluation.played ? [ply, scoreValue(p.evaluation.played), p] : null);
    }
    const x = (ply) => (ply / n) * W, y = (v) => mid - v * (mid - 4);
    let area = "", line = "", marks = "";
    let run = [];
    const flush = () => {
      if (run.length) {
        const d = run.map(([ply, v], k) => `${k ? "L" : "M"}${x(ply).toFixed(1)},${y(v).toFixed(1)}`).join("");
        area += `<path d="${d}L${x(run[run.length - 1][0]).toFixed(1)},${H}L${x(run[0][0]).toFixed(1)},${H}Z" fill="var(--eval-white)"/>`;
        line += `<path d="${d}" fill="none" stroke="var(--eval-line)" stroke-width="1.2"/>`;
      }
      run = [];
    };
    for (const pt of pts) { if (pt) run.push(pt); else flush(); }
    flush();
    for (const pt of pts) {
      if (!pt) continue;
      const [ply, v, p] = pt;
      const kind = p.label ? p.label.kind : (["inaccuracy", "mistake", "blunder"].includes(p.grade) ? p.grade : null);
      if (kind) marks += `<circle cx="${x(ply).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.6" fill="var(--${kind})" stroke="var(--panel)" stroke-width="1"/>`;
    }
    const cur = `<line x1="${x(state.ply).toFixed(1)}" x2="${x(state.ply).toFixed(1)}" y1="0" y2="${H}" stroke="var(--accent)" stroke-width="1.5"/>`;
    $("graph").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="평가 그래프">` +
      `<rect width="${W}" height="${H}" fill="var(--eval-black)"/>${area}${line}` +
      `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--eval-line)" stroke-dasharray="3 3" stroke-width="0.8"/>${cur}${marks}</svg>`;
  }

  function renderSummary() {
    const s = state.doc.summary;
    const cols = [...Object.keys(GRADES).map((g) => [g, GRADES[g], "grades"]), ...Object.keys(LABELS).map((k) => [k, LABELS[k], "labels"])];
    const head = cols.map(([k, info]) => `<th title="${esc(info.ko)}" style="color:var(--${k})">${esc(info.sym)}</th>`).join("");
    const row = (side) => `<tr><td>${side === "white" ? "백" : "흑"}</td>` +
      cols.map(([k, , group]) => `<td>${(s[side][group] || {})[k] || 0}</td>`).join("") + `<td>${s[side].inconclusive}</td></tr>`;
    $("summary").innerHTML = `<table><tr><th></th>${head}<th title="판정 보류">…</th></tr>${row("white")}${row("black")}</table>`;
  }

  function renderMeta() {
    const d = state.doc, pr = d.provenance, g = d.grading;
    let curve = g.policy;
    if (g.curve) {
      curve += ` · ${g.curve.model}`;
      if (g.curve.source === "table") curve += ` (${g.curve.table}, ${g.curve.time_class} ${g.curve.band}${g.curve.clamped ? ", clamped" : ""})`;
      else curve += ` (scale ${g.curve.scale})`;
    }
    const warn = g.fallback ? `<div class="warn">레이팅·시간 형식이 없어 기본 곡선으로 채점했습니다.</div>` : "";
    const analysed = d.plies.length, total = d.game.moves.length;
    $("meta").innerHTML = warn +
      `엔진 ${esc(pr.engine.name)} · ${esc(pr.engine.profile.name)} (depth ${pr.engine.profile.depth}, multipv ${pr.engine.profile.multipv})<br>` +
      `채점 ${esc(curve)} · 라벨 ${esc(Object.values(pr.label_rules).join(", "))}<br>` +
      `분석 ${analysed}/${total} 플라이 · 빌드 ${esc(pr.build_digest.slice(0, 12))} · ${esc(pr.phrasebook.name)}`;
  }

  // -- input -------------------------------------------------------------------------------------

  function showError(err) {
    const box = $("error");
    if (box) box.textContent = String(err.message || err);
    else alert(String(err.message || err));
  }

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = () => { try { load(JSON.parse(reader.result), file.name); } catch (err) { showError(err); } };
    reader.onerror = () => showError(reader.error || new Error("파일을 읽지 못했습니다."));
    reader.readAsText(file);
  }

  $("file").onchange = (e) => { if (e.target.files[0]) readFile(e.target.files[0]); };
  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drop"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("drop"); });
  document.addEventListener("drop", (e) => {
    e.preventDefault(); document.body.classList.remove("drop");
    if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });
  document.addEventListener("keydown", (e) => {
    if (!state.doc || e.target.tagName === "INPUT") return;
    const pv = state.preview;
    if (e.key === "Escape" && pv) clearPreview();
    else if (e.key === "ArrowLeft") pv && pv.pinned && pv.frames.length > 1 ? step(-1) : go(state.ply - 1);
    else if (e.key === "ArrowRight") pv && pv.pinned && pv.frames.length > 1 ? step(1) : go(state.ply + 1);
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(state.positions.length - 1);
    else if (e.key === "f" || e.key === "F") { state.flipped = !state.flipped; renderBoard(); renderEvalBar(); renderPlayers(); }
    else return;
    e.preventDefault();
  });

  const themes = [null, "light", "dark"];
  let theme = 0;
  try { theme = Math.max(0, themes.indexOf(localStorage.getItem("calliope-theme"))); } catch (_) { /* no storage */ }
  const applyTheme = () => {
    if (themes[theme]) document.documentElement.dataset.theme = themes[theme];
    else delete document.documentElement.dataset.theme;
    $("theme").textContent = ["테마: 자동", "테마: 밝게", "테마: 어둡게"][theme];
  };
  $("theme").onclick = () => {
    theme = (theme + 1) % themes.length;
    try { localStorage.setItem("calliope-theme", themes[theme] || ""); } catch (_) { /* no storage */ }
    applyTheme();
  };
  applyTheme();

  const embedded = document.getElementById("calliope-doc");  // a page built with its document
  const param = new URLSearchParams(location.search).get("file");
  if (embedded) {
    try { load(JSON.parse(embedded.textContent), embedded.dataset.name || ""); } catch (err) { showError(err); }
  } else if (param) {
    fetch(param).then((r) => { if (!r.ok) throw new Error(`${param}: ${r.status}`); return r.json(); })
      .then((doc) => load(doc, param)).catch(showError);
  }
}
</script>
</body>
</html>
