<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calliope Viewer</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --text: #1f2328; --muted: #6b6f76; --border: #dcd9d1;
  --hover: #f0eee8; --sel: #e3ecfb; --accent: #2f6fde;
  --sq-light: #ecdcb9; --sq-dark: #b08a62; --coord-light: #b08a62; --coord-dark: #ecdcb9;
  --last: rgba(244, 208, 63, 0.55); --ref: #e8590c; --ref-soft: rgba(232, 89, 12, 0.35);
  --eval-white: #f2f2f2; --eval-black: #3a3a3a; --eval-line: #8a8a8a;
  --eval-on-white: #1f2328; --eval-on-black: #f2f2f2;
  --best: #2e9d4f; --excellent: #64a83b; --good: #3b8f8a; --inaccuracy: #d4a017;
  --mistake: #e2742b; --blunder: #cf3030; --brilliant: #1a9fb5; --great: #3b6fd4;
  --miss: #c2410c; --forced: #7a7f87; --warn-bg: #fff4d6; --warn-text: #7a5300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #212328; --text: #e6e6e3; --muted: #9a9ea6; --border: #34373e;
    --hover: #2a2d33; --sel: #253450; --accent: #6d9cf0;
    --sq-light: #c9b48f; --sq-dark: #8a6a4a; --coord-light: #8a6a4a; --coord-dark: #c9b48f;
    --eval-white: #d9d9d9; --eval-black: #2b2d31; --warn-bg: #3b3220; --warn-text: #f2d48a;
    --eval-on-white: #17181b; --eval-on-black: #e6e6e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #212328; --text: #e6e6e3; --muted: #9a9ea6; --border: #34373e;
  --hover: #2a2d33; --sel: #253450; --accent: #6d9cf0;
  --sq-light: #c9b48f; --sq-dark: #8a6a4a; --coord-light: #8a6a4a; --coord-dark: #c9b48f;
  --eval-white: #d9d9d9; --eval-black: #2b2d31; --warn-bg: #3b3220; --warn-text: #f2d48a;
  --eval-on-white: #17181b; --eval-on-black: #e6e6e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}
header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
}
header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
header .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, .button {
  font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; cursor: pointer;
}
button:hover, .button:hover { background: var(--hover); }
button:disabled { opacity: 0.45; cursor: default; }
input[type="file"] { display: none; }
main {
  display: grid; grid-template-columns: minmax(280px, 560px) minmax(300px, 1fr); gap: 16px;
  padding: 16px; max-width: 1280px; margin: 0 auto;
}
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
#empty { grid-column: 1 / -1; padding: 48px 24px; text-align: center; color: var(--muted); }
#empty code { background: var(--hover); padding: 2px 6px; border-radius: 4px; color: var(--text); }
#empty pre {
  display: inline-block; text-align: left; background: var(--hover); color: var(--text);
  padding: 10px 14px; border-radius: 6px; overflow-x: auto; max-width: 100%;
}
.drop { outline: 3px dashed var(--accent); outline-offset: -8px; }
#error { color: var(--blunder); font-weight: 600; }

.left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.players { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; }
.player { display: flex; align-items: center; gap: 8px; min-width: 0; }
.player .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
.player .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .rating { color: var(--muted); }
#preview {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-height: 38px;
  font-size: 14px; border-color: var(--ref);
}
#preview .caption { flex: 1; min-width: 0; }
#preview .caption b { color: var(--ref); }
#preview[hidden] { display: none; }
.board-wrap { display: flex; gap: 6px; align-items: stretch; }
#board { flex: 1; min-width: 0; }
#board svg { display: block; width: 100%; height: auto; border-radius: 6px; }
#evalbar {
  position: relative; width: 24px; flex: none; overflow: hidden; border-radius: 4px;
  background: var(--eval-black); border: 1px solid var(--border);
}
#evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--eval-white); transition: height 0.25s ease; }
#evalbar.flipped .fill { bottom: auto; top: 0; }
#evalbar .num {
  position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -0.3px;
}
@media (prefers-reduced-motion: reduce) { #evalbar .fill { transition: none; } }
.controls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.controls button { min-width: 44px; }
#graph svg { display: block; width: 100%; height: 110px; cursor: pointer; }
#graph { padding: 6px; }

.right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
#ply { padding: 14px 16px; }
#ply h2 { margin: 0 0 6px; font-size: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: 13px; font-weight: 650; color: #fff;
}
.badge.provisional::after { content: "잠정"; font-weight: 500; opacity: 0.85; font-size: 11px; }
.evalline { color: var(--muted); font-size: 14px; margin-top: 8px; }
.evalline b { color: var(--text); font-variant-numeric: tabular-nums; }
#text { font-size: 16px; line-height: 1.65; }
#text .seg { border-radius: 3px; }
#text .seg.has-refs { cursor: pointer; text-decoration: underline dotted var(--ref); text-underline-offset: 3px; }
#text .seg.has-refs:hover, #text .seg.active { background: var(--ref-soft); }
#text .seg.judgement { font-weight: 650; }
#text .seg.scope { color: var(--muted); font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
details.claims { margin-top: 10px; font-size: 13px; color: var(--muted); }
#ai { padding: 12px 16px; font-size: 14px; }
#ai[hidden] { display: none; }
#ai .ai-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#ai h2 { margin: 0; font-size: 16px; }
#ai .error { color: var(--blunder); font-weight: 600; margin-top: 6px; }
/* the MCP App (AG3-D D11): no file picker, no analysis server, the host's theme */
body.mcp-app label[for="file"], body.mcp-app #new, body.mcp-app #theme { display: none; }
.ai-one { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 8px; }
.ai-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ai-head .who { font-weight: 600; }
.tag { font-size: 12px; border-radius: 999px; padding: 0 8px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.tag.level { border-color: var(--accent); color: var(--accent); cursor: help; }
.tag.interp { border-color: var(--muted); }
.tag.agent { border-color: var(--warn-text); color: var(--warn-text); }
.tag.other { background: var(--hover); }
.ai-sentences { margin: 8px 0; padding-left: 22px; }
.ai-sentences li { margin: 4px 0; line-height: 1.6; }
.ai-sentences .sent.interpretation { color: var(--muted); border-left: 3px solid var(--border); padding-left: 8px; margin-left: -11px; }
.ai-sentences .tag { margin-right: 4px; }
.chip { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--hover); border-radius: 4px; padding: 0 4px; margin-left: 2px; color: var(--muted); }
.ai-props { font-size: 13px; }
.ai-props summary { color: var(--muted); cursor: pointer; }
.ai-props ul { margin: 4px 0; padding-left: 18px; }
.ai-props li { margin: 3px 0; border-radius: 4px; padding: 1px 4px; }
.ai-props li.hl { background: var(--sel); }
.ai-props code, .ai-head code { font-size: 12px; }
.has-frames { cursor: pointer; text-decoration: underline dotted var(--ref); text-underline-offset: 3px; }
.has-frames:hover, .has-frames.active { background: var(--ref-soft); }
.ai-subject { font-size: 13px; margin-top: 4px; display: inline-block; border-radius: 4px; padding: 0 4px; }
.ai-others, .ai-offgame { margin-top: 10px; }
.ai-others > summary, .ai-offgame > summary { cursor: pointer; color: var(--muted); }
details.claims li { margin: 2px 0; }

#moves { max-height: 420px; overflow-y: auto; padding: 4px 0; }
#moves table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
#moves td { padding: 2px 6px; }
#moves td.no { color: var(--muted); width: 42px; text-align: right; }
#moves .mv { cursor: pointer; border-radius: 4px; padding: 2px 6px; display: inline-flex; gap: 6px; align-items: center; }
#moves .mv:hover { background: var(--hover); }
#moves .mv.current { background: var(--sel); font-weight: 650; }
#moves .mv.unanalysed { color: var(--muted); }
.sym { font-size: 12px; font-weight: 700; min-width: 16px; text-align: center; }

#summary { padding: 10px 12px; font-size: 13px; overflow-x: auto; }
#summary table { border-collapse: collapse; width: 100%; }
#summary th, #summary td { padding: 2px 6px; text-align: center; }
#summary th:first-child, #summary td:first-child { text-align: left; }
#meta { padding: 10px 12px; font-size: 12px; color: var(--muted); }
.warn { background: var(--warn-bg); color: var(--warn-text); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
#analyse { grid-column: 1 / -1; padding: 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; color: var(--text); }
#analyse h2, #job h2 { margin: 0; font-size: 17px; }
#analyse textarea {
  width: 100%; min-height: 180px; resize: vertical; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
}
#analyse .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#analyse input[type="text"] {
  font: inherit; font-size: 14px; color: var(--text); background: var(--bg); width: 9em;
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
}
#analyse .primary, #job .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#analyse .error, #job .error { color: var(--blunder); font-weight: 600; }
#games { width: 100%; border-collapse: collapse; font-size: 14px; }
#games td { padding: 6px 4px; border-top: 1px solid var(--border); }
#games tr.game { cursor: pointer; }
#games tr.game:hover { background: var(--hover); }
#games .state { color: var(--muted); white-space: nowrap; text-align: right; }
#job { grid-column: 1 / -1; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
#job .bar { height: 10px; background: var(--hover); border-radius: 999px; overflow: hidden; }
#job .bar div { height: 100%; background: var(--accent); transition: width 0.4s ease; }
@media (prefers-reduced-motion: reduce) { #job .bar div { transition: none; } }
@media (max-width: 860px) {
  /* one column: the explanation right under the board, the move list and the rest after it */
  main { grid-template-columns: 1fr; gap: 10px; padding-bottom: 76px; }
  .left, .right { display: contents; }
  #top { order: 1; } #preview { order: 2; } .board-wrap { order: 3; } #ply { order: 4; } #ai { order: 4; }
  #bottom { order: 5; } #graph { order: 6; } #moves { order: 7; } #summary { order: 8; }
  #meta { order: 9; }
  #moves { max-height: 260px; }
  .controls {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; flex-wrap: nowrap;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .controls button { flex: 1; min-width: 0; min-height: 42px; font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>Calliope Viewer</h1>
  <div class="actions">
    <span id="filename" class="hint"></span>
    <a class="button" id="new" href="./" hidden>새 분석</a>
    <label class="button" for="file">결과 파일 열기</label>
    <input type="file" id="file" accept=".json,application/json">
    <button id="theme" title="테마 전환">테마</button>
  </div>
</header>

<main id="app">
  <section id="empty" class="panel">
    <p><b>calliope_result_v1</b> JSON 파일을 열거나 이 창에 끌어다 놓으세요.</p>
    <pre>CALLIOPE_STOCKFISH_PATH=… PYTHONPATH=. python -m tools.explain_game game.pgn --json game.json</pre>
    <p>서버로 띄웠다면 <code>?file=경로/game.json</code> 으로 바로 열 수도 있습니다.</p>
    <p id="error"></p>
  </section>
</main>

<script>
"use strict";

// -- pure part: positions, references, formatting (tested with node: tests/viewer) -------------

const FILES = "abcdefgh";
const GRADES = {
  best: { ko: "최선", sym: "★" }, excellent: { ko: "우수", sym: "✦" }, good: { ko: "좋음", sym: "✓" },
  inaccuracy: { ko: "부정확", sym: "?!" }, mistake: { ko: "실수", sym: "?" }, blunder: { ko: "블런더", sym: "??" },
};
const LABELS = {
  brilliant: { ko: "브릴리언트", sym: "!!" }, great: { ko: "그레이트", sym: "!" },
  miss: { ko: "미스", sym: "✗" }, forced: { ko: "강제", sym: "□" },
};
const PIECE_KO = { king: "킹", queen: "퀸", rook: "룩", bishop: "비숍", knight: "나이트", pawn: "폰" };
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };

function squareIndex(sq) { return (8 - Number(sq[1])) * 8 + FILES.indexOf(sq[0]); }
function squareName(i) { return FILES[i % 8] + (8 - Math.floor(i / 8)); }

/** The 64 squares of a FEN's placement, a8 first; "" for an empty square. */
function parsePlacement(fen) {
  const out = [];
  for (const row of fen.split(" ")[0].split("/")) {
    for (const ch of row) {
      if (/\d/.test(ch)) for (let k = 0; k < Number(ch); k++) out.push("");
      else out.push(ch);
    }
  }
  if (out.length !== 64) throw new Error("bad FEN: " + fen);
  return out;
}

function placementKey(board) { return board.map((p) => p || ".").join(""); }

/** The board after a UCI move: castling moves the rook, en passant removes the pawn. */
function applyUci(board, uci) {
  const b = board.slice();
  const from = squareIndex(uci.slice(0, 2)), to = squareIndex(uci.slice(2, 4));
  const piece = b[from];
  if (!piece) throw new Error("no piece on " + uci.slice(0, 2));
  const white = piece === piece.toUpperCase();
  const df = (to % 8) - (from % 8);
  if (piece.toLowerCase() === "k" && Math.abs(df) === 2) {
    const rank = Math.floor(from / 8) * 8;
    const [rf, rt] = df > 0 ? [rank + 7, rank + 5] : [rank, rank + 3];
    b[rt] = b[rf]; b[rf] = "";
  }
  if (piece.toLowerCase() === "p" && df !== 0 && !b[to]) {
    b[Math.floor(from / 8) * 8 + (to % 8)] = "";  // en passant: the pawn beside the mover
  }
  b[to] = uci.length > 4 ? (white ? uci[4].toUpperCase() : uci[4].toLowerCase()) : piece;
  b[from] = "";
  return b;
}

/** Every position of the game: index k is the board after k plies. */
function gamePositions(doc) {
  const out = [parsePlacement(doc.game.start_fen)];
  for (const m of doc.game.moves) out.push(applyUci(out[out.length - 1], m.uci));
  return out;
}

function fenMover(fen) {
  const f = fen.split(" ");
  return { white: f[1] === "w", fullmove: Number(f[5] || 1) };
}

function numbered(fen, san) {
  const m = fenMover(fen);
  return m.white ? `${m.fullmove}.${san}` : `${m.fullmove}...${san}`;
}

/** SAN of a line, numbered from its start FEN; `upto` marks the move shown on the board. */
function lineText(fen, moves, truncated, upto) {
  let { white, fullmove } = fenMover(fen);
  const parts = moves.map((m, i) => {
    const text = i === 0 || white ? (white ? `${fullmove}.${m.san}` : `${fullmove}...${m.san}`) : m.san;
    if (!white) fullmove += 1;
    white = !white;
    return i === upto ? `<b>${esc(text)}</b>` : esc(text);
  });
  return parts.join(" ") + (truncated ? " …" : "");
}

/** Board frames a reference draws (AR-D §4: each in its own position). */
function refFrames(ref) {
  if (ref.kind === "piece") {
    const side = ref.color === "white" ? "백" : "흑";
    return [{ board: parsePlacement(ref.fen), rings: [ref.square], arrows: [],
              caption: esc(`${side} ${PIECE_KO[ref.piece] || ref.piece} ${ref.square}`) }];
  }
  if (ref.kind === "square") {
    return [{ board: parsePlacement(ref.fen), rings: [ref.square], arrows: [], caption: esc(ref.square) }];
  }
  if (ref.kind === "move") {
    return [{ board: applyUci(parsePlacement(ref.fen), ref.uci), rings: [],
              arrows: [[ref.uci.slice(0, 2), ref.uci.slice(2, 4)]], caption: esc(numbered(ref.fen, ref.san)) }];
  }
  if (ref.kind === "line") {
    const frames = [];
    let board = parsePlacement(ref.fen);
    ref.moves.forEach((m, i) => {
      board = applyUci(board, m.uci);
      frames.push({ board, rings: [], arrows: [[m.uci.slice(0, 2), m.uci.slice(2, 4)]],
                    caption: lineText(ref.fen, ref.moves, ref.truncated, i) });
    });
    return frames;
  }
  return [];
}

/** A segment's frames: consecutive frames of one position are drawn together. */
function segmentFrames(refs) {
  const out = [];
  for (const frame of refs.flatMap(refFrames)) {
    const last = out[out.length - 1];
    if (last && placementKey(last.board) === placementKey(frame.board)) {
      const rings = frame.rings.filter((r) => !last.rings.includes(r));
      const arrows = frame.arrows.filter((a) => !last.arrows.some((b) => b[0] === a[0] && b[1] === a[1]));
      last.rings = last.rings.concat(rings);
      last.arrows = last.arrows.concat(arrows);
      // a frame that adds nothing (a line's first move after the same move) keeps the fuller caption
      last.caption = rings.length || arrows.length ? `${last.caption} · ${frame.caption}` : frame.caption;
    } else {
      out.push({ ...frame });
    }
  }
  return out;
}

function scoreText(score) {
  if (!score) return "–";
  if ("mate" in score) return (score.mate > 0 ? "M" : "−M") + Math.abs(score.mate);
  const v = score.cp / 100;
  return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
}

/** White's advantage in [-1, 1]: a logistic of the centipawns, ±1 for a mate. */
function scoreValue(score) {
  if ("mate" in score) return score.mate > 0 ? 1 : -1;
  return 2 / (1 + Math.exp(-0.004 * score.cp)) - 1;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** The board as SVG; `opts`: flipped, last [from, to], rings [sq], arrows [[from, to]]. */
function boardSvg(board, opts = {}) {
  const S = 60, out = [];
  const xy = (sq) => {
    const i = squareIndex(sq);
    let c = i % 8, r = Math.floor(i / 8);
    if (opts.flipped) { c = 7 - c; r = 7 - r; }
    return [c * S, r * S];
  };
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${8 * S} ${8 * S}" role="img" aria-label="board">`);
  out.push(`<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ref)"/></marker></defs>`);
  for (let i = 0; i < 64; i++) {
    const sq = squareName(i), [x, y] = xy(sq);
    const light = ((i % 8) + Math.floor(i / 8)) % 2 === 0;
    out.push(`<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="var(${light ? "--sq-light" : "--sq-dark"})"/>`);
    if (opts.last && opts.last.includes(sq)) out.push(`<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="var(--last)"/>`);
  }
  for (let k = 0; k < 8; k++) {  // coordinates on the bottom rank and the left file
    const file = opts.flipped ? FILES[7 - k] : FILES[k], rank = opts.flipped ? k + 1 : 8 - k;
    const lightFile = (k + 7) % 2 === 0, lightRank = k % 2 === 0;
    out.push(`<text x="${k * S + S - 4}" y="${8 * S - 4}" font-size="11" text-anchor="end" fill="var(${lightFile ? "--coord-light" : "--coord-dark"})">${file}</text>`);
    out.push(`<text x="3" y="${k * S + 12}" font-size="11" fill="var(${lightRank ? "--coord-light" : "--coord-dark"})">${rank}</text>`);
  }
  for (const sq of opts.rings || []) {
    const [x, y] = xy(sq);
    out.push(`<circle cx="${x + S / 2}" cy="${y + S / 2}" r="${S / 2 - 3}" fill="none" stroke="var(--ref)" stroke-width="4"/>`);
  }
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (!p) continue;
    const [x, y] = xy(squareName(i));
    const white = p === p.toUpperCase();
    out.push(`<text x="${x + S / 2}" y="${y + S * 0.8}" font-size="${S * 0.78}" text-anchor="middle" ` +
      `font-family="'DejaVu Sans','Segoe UI Symbol','Noto Sans Symbols2','Apple Symbols',serif" ` +
      `fill="${white ? "#fafafa" : "#1b1b1b"}" stroke="${white ? "#1b1b1b" : "#fafafa"}" stroke-width="${white ? 1.6 : 0.6}" ` +
      `paint-order="stroke">${GLYPH[p.toLowerCase()]}︎</text>`);
  }
  for (const [from, to] of opts.arrows || []) {
    const [x1, y1] = xy(from), [x2, y2] = xy(to);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, cut = S * 0.32;
    out.push(`<line x1="${x1 + S / 2}" y1="${y1 + S / 2}" x2="${x2 + S / 2 - (dx / len) * cut}" y2="${y2 + S / 2 - (dy / len) * cut}" ` +
      `stroke="var(--ref)" stroke-width="${S * 0.16}" stroke-linecap="round" opacity="0.85" marker-end="url(#ah)"/>`);
  }
  out.push("</svg>");
  return out.join("");
}

// -- the analysis server (AS-D §7): relative URLs only, so any proxy prefix works ---------------

const POLL_MS = 2000;

/** The page's path with a "/" added when it ends neither in "/" nor in ".html" (`/proxy/8765`):
 *  without it, relative URLs would resolve one level up. null when the path is fine. */
function normalizedPath(pathname) {
  return pathname.endsWith("/") || pathname.endsWith(".html") ? null : pathname + "/";
}

/** The API, over a `fetch` function. Every URL is relative to the page. */
function serverClient(fetchFn) {
  const answer = (r) => r.text().then((t) => {
    let body = null;
    try { body = t ? JSON.parse(t) : null; } catch (_) { body = { error: t }; }
    return { ok: r.ok, status: r.status, body };
  });
  const get = (url) => fetchFn(url, { headers: { Accept: "application/json" } }).then(answer);
  return {
    list: () => get("api/games"),
    status: (id) => get(`api/games/${encodeURIComponent(id)}`),
    result: (id) => get(`api/games/${encodeURIComponent(id)}/result`),
    commentary: (id) => get(`api/games/${encodeURIComponent(id)}/commentary`),
    post: (pgn, plies) => fetchFn("api/games", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(plies ? { pgn, plies } : { pgn }),
    }).then(answer),
  };
}

/** Poll a job until it is done or failed; `onStatus` sees every status. Resolves with the last
 *  one. `wait(ms)` is injected so tests need no timers. */
async function pollJob(client, id, onStatus, wait) {
  for (;;) {
    const r = await client.status(id);
    if (!r.ok) throw new Error((r.body && r.body.error) || `상태를 읽지 못했습니다 (${r.status})`);
    onStatus(r.body);
    if (r.body.state === "done" || r.body.state === "failed") return r.body;
    await wait(POLL_MS);
  }
}

function durationText(seconds) {
  if (seconds < 60) return `${Math.max(1, Math.round(seconds))}초`;
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  return s ? `${m}분 ${s}초` : `${m}분`;
}

/** One line of a job's status, in Korean. */
function progressText(status) {
  const p = status.plies || {};
  if (status.state === "queued") {
    return status.queue_position > 1 ? `대기 중 (앞에 ${status.queue_position - 1}개)` : "곧 시작합니다";
  }
  if (status.state === "running") {
    let text = `분석 중 ${p.done}/${p.total}수`;
    if (status.current) text += ` · ${status.current.ply}번째 수 ${status.current.san}`;
    if (p.cached) text += ` · 저장된 분석 ${p.cached}수`;
    if (status.eta_seconds != null) text += ` · 남은 시간 약 ${durationText(status.eta_seconds)}`;
    return text;
  }
  if (status.state === "done") return `완료 (${p.total}수)`;
  if (status.state === "failed") return `실패: ${status.error || "알 수 없는 오류"}`;
  return status.state;
}

/** "Alice – Bob" or "백 – 흑", with the date when known. */
function gameTitle(game) {
  const g = game || {};
  return `${g.white || "백"} – ${g.black || "흑"}` + (g.date ? ` · ${g.date}` : "");
}

// -- AI commentary (AG3-D): the agent's sentences, Calliope's verified propositions --------------

const USE_KO = {
  result: "결과", line_fact: "수순 사실", mechanism: "원리", associated: "함께 나타남",
  comparison: "비교", uncertain: "확인되지 않음", not_the_case: "그렇지 않음",
};
const SCOPE_KO = {  // glossary_ko_v1
  specific_line: "엔진 라인에서", persistence: "그 구간의 모든 국면에서", exists_response: "응수 중 하나에 대해",
  all_responses: "고려한 응수 모두에 대해", exists_alternative: "다른 수 중 하나에서",
  all_alternatives: "고려한 다른 수 모두에서", selected_alternatives: "지정한 다른 수들에서",
};
const STATUS_KO = { supported: "확인됨", inconclusive: "확인되지 않음", refuted: "그렇지 않음" };
const EXPOSED_KO = { exposed: "노출됨", not_exposed: "노출 안 됨", undecided: "판단 보류" };
const NEEDS_MOVES = ["judgement", "engine_score", "engine_line", "explored_line", "after_reply"];
const AI_NOTE = "명제는 Calliope 데이터로 확인했습니다. 문장은 인용한 명제의 수·평가·칸·숫자만 확인했고, 해석은 에이전트의 의견입니다.";

const isSquare = (s) => typeof s === "string" && /^[a-h][1-8]$/.test(s);
const flat = (v) => (Array.isArray(v) ? v.flatMap(flat) : [v]);

/** A record the panel can show (AG3-D D12): what is missing is skipped, never guessed. */
function readableCommentary(c) {
  return !!c && typeof c.id === "string" && Array.isArray(c.propositions) && Array.isArray(c.sentences) &&
    c.sentences.length > 0 && c.propositions.every((p) => p && typeof p.id === "string" && typeof p.kind === "string") &&
    c.sentences.every((s) => s && typeof s.text === "string" && Array.isArray(s.cites) &&
                             (s.class === "sourced" || s.class === "interpretation"));
}

/** The first move of a display line, numbered; the UCI when there is no display (D14). */
function displayMove(d, uci) {
  if (d && d.moves && d.moves[0]) return esc(numbered(d.fen, d.moves[0].san));
  return esc(uci == null ? "?" : uci);
}

/** One Korean line of a proposition, from its verified fields and `display` only (AG3-D §3). */
function propositionLine(p) {
  const d = p.display, sq = (s) => esc(s == null ? "?" : s);
  let text;
  switch (p.kind) {
    case "judgement": {
      const g = GRADES[p.grade], l = p.label && LABELS[p.label];
      text = `판정: ${displayMove(d, p.move)} — ${esc(g ? g.ko : p.grade)}${l ? ", " + esc(l.ko) : ""}` +
        ` · 최선수 ${displayMove(d && d.best, p.best_move)}`;
      break;
    }
    case "claim":
      text = `주장 <code>${esc(p.template)}</code> (${esc(STATUS_KO[p.status] || p.status)}) — ${esc(USE_KO[p.use] || p.use)}` +
        (Array.isArray(p.scopes) && p.scopes.length
          ? " · 범위: " + p.scopes.map((s) => esc(SCOPE_KO[s && s.quantifier] || (s && s.quantifier))).join(", ") : "");
      break;
    case "engine_score":
      text = `엔진 평가: ${displayMove(d, p.move)} 이후 ${esc(scoreText(p.score))}` + (p.depth ? ` (깊이 ${esc(p.depth)})` : "");
      break;
    case "engine_line":
      text = `엔진 수순: ${d ? lineText(d.fen, d.moves, false, -1) : esc((p.moves || []).join(" "))}`;
      break;
    case "explored_line":
      text = `에이전트 수순: ${d ? lineText(d.fen, d.moves, false, -1) : esc((p.moves || []).join(" "))}`;
      break;
    case "material": {
      const b = Number(p.balance);
      text = `기물 득실: 수순의 ${esc(p.from)}–${esc(p.to)} 구간, ${p.side === "black" ? "흑" : "백"} ` +
        `${b > 0 ? "+" : b < 0 ? "−" : ""}${esc(Math.abs(b))}`;
      break;
    }
    case "definition": text = `정의: <code>${esc(p.definition)}</code>`; break;
    case "attack": text = `공격: ${sq(p.attacker)} → ${sq(p.target)}`; break;
    case "defence": text = `방어: ${sq(p.defender)} → ${sq(p.defended)}`; break;
    case "exposed":
      text = `노출: ${sq(p.piece)} (${esc(EXPOSED_KO[p.exposed] || p.exposed)}${p.gain != null ? `, 이득 ${esc(p.gain)}` : ""})`;
      break;
    case "pin": text = `핀: ${sq(p.pinner)} → ${sq(p.pinned)} (고정된 기물 ${sq(p.pinned)})`; break;
    case "check":
      text = Array.isArray(p.checkers) && p.checkers.length ? `체크: ${p.checkers.map(sq).join(", ")}` : "체크 아님";
      break;
    case "legal_moves":
      if (d && Array.isArray(d.choices)) text = `합법수 ${d.choices.length}개: ${d.choices.map((c) => esc(c.san)).join(", ")}`;
      else if (Array.isArray(p.moves)) text = `합법수 ${p.moves.length}개: ${esc(p.moves.join(", "))}`;
      else text = `합법수 ${esc(p.count)}개`;
      break;
    case "pattern": {
      const squares = flat(Object.values(p.participants || {})).filter(isSquare);
      text = `배치 <code>${esc(p.pattern)}</code>: ${squares.map(sq).join(", ")} (배치일 뿐)`;
      break;
    }
    case "after_reply": {
      const side = (x) => (x && typeof x === "object" ? propositionLine({ ...x, by_agent: false }) : "?");
      const reply = d && d.a && d.a.moves[1] ? esc(d.a.moves[1].san) : esc(p.reply);
      text = `응수 비교: 같은 응수 ${reply} 뒤 — A: ${side(p.proposition_a)} / B: ${side(p.proposition_b)}`;
      break;
    }
    default: text = `${esc(p.kind)} <code>${esc(p.id)}</code>`;
  }
  if (!d && NEEDS_MOVES.includes(p.kind)) text += ` <span class="hint">(표시할 수 없음)</span>`;
  if (p.by_agent) text += ` <span class="tag agent">에이전트 탐색</span>`;
  return text;
}

/** The squares a position proposition marks, and its arrows. */
function positionMarks(p) {
  switch (p.kind) {
    case "attack": return { rings: [p.attacker, p.target], arrows: [[p.attacker, p.target]] };
    case "defence": return { rings: [p.defender, p.defended], arrows: [[p.defender, p.defended]] };
    case "exposed": return { rings: [p.piece], arrows: [] };
    case "pin": return { rings: [p.pinned, p.pinner], arrows: [[p.pinner, p.pinned]] };
    case "check": return { rings: p.checkers || [], arrows: [] };
    case "pattern": return { rings: flat(Object.values(p.participants || {})), arrows: [] };
    default: return { rings: [], arrows: [] };
  }
}

/** Board frames of a proposition, from its `display` only (AG3-D D7): a line steps through its
 *  moves; each legal move (`choices`) is a frame of its own from the same position. */
function propositionFrames(p) {
  const d = p.display;
  if (!d || typeof d.fen !== "string" || !Array.isArray(d.moves)) return [];
  const move = (line, k = 0) => (line && line.moves[k]
    ? refFrames({ kind: "move", fen: line.fen, uci: line.moves[k].uci, san: line.moves[k].san }) : []);
  const line = (l) => (l && l.moves.length ? refFrames({ kind: "line", fen: l.fen, moves: l.moves }) : []);
  switch (p.kind) {
    case "judgement": return [...move(d), ...(d.best && d.best.moves[0] && d.best.moves[0].uci !== p.move ? move(d.best) : [])];
    case "engine_score": return move(d);
    case "engine_line": case "explored_line": case "material": return line(d);
    case "after_reply": return [...line(d.a), ...line(d.b)];
    case "legal_moves":
      if (Array.isArray(d.choices)) return d.choices.flatMap((c) => refFrames({ kind: "move", fen: d.fen, uci: c.uci, san: c.san }));
      return [{ board: parsePlacement(d.fen), rings: [], arrows: [], caption: propositionLine(p) }];
    default: {
      const marks = positionMarks(p);
      return [{ board: parsePlacement(d.fen), rings: marks.rings.filter(isSquare),
                arrows: marks.arrows.filter((a) => isSquare(a[0]) && isSquare(a[1])), caption: propositionLine(p) }];
    }
  }
}

/** Where each commentary goes (AG3-D D4, D8): per ply the main one and the others; judged moves
 *  by their path — on ply k only from the played path to ply k — else at game level. */
function commentaryIndex(source, game) {
  const played = game.moves.map((m) => m.uci);
  const plies = new Map(), offGame = [];
  const at = (ply) => { if (!plies.has(ply)) plies.set(ply, { main: null, others: [] }); return plies.get(ply); };
  if (source.doc) {
    for (const p of source.doc.plies || []) if (readableCommentary(p.ai_commentary)) at(p.ply).main = p.ai_commentary;
    return { plies, offGame, any: plies.size > 0 };
  }
  const listing = source.listing || {};
  for (const [key, list] of Object.entries(listing.plies || {})) {
    const entries = (Array.isArray(list) ? list : []).filter(readableCommentary);
    const main = entries.find((c) => c.stale === false) || null;
    const slot = at(Number(key));
    slot.main = main;
    for (const c of entries) {
      if (c === main) continue;
      const tag = c.stale === true ? "다른 분석 기준" : c.stale === null ? "분석 범위 밖" : "이전 해설";
      slot.others.push({ c, tag });
    }
  }
  for (const c of (Array.isArray(listing.judged) ? listing.judged : []).filter(readableCommentary)) {
    const path = c.subject && Array.isArray(c.subject.path) ? c.subject.path : [];
    const before = path.slice(0, -1);
    const subject = c.display && c.display.subject;
    const what = subject ? displayMove(subject, path[path.length - 1]) : esc(path[path.length - 1] || "?");
    if (path.length && before.length <= played.length && before.every((u, i) => u === played[i])) {
      at(before.length).others.push({ c, tag: `두지 않은 수 ${what}에 대한 해설`, judged: true });
    } else {
      offGame.push({ c, tag: `${what}에 대한 해설 (본선 밖)`, judged: true });
    }
  }
  return { plies, offGame, any: plies.size > 0 || offGame.length > 0 };
}

/** Server mode (D1): the listing route read into an index; an error becomes a message, never a
 *  throw, so the board keeps working. */
async function fetchCommentary(client, id, game) {
  try {
    const r = await client.commentary(id);
    if (!r.ok) return { index: null, error: `해설을 읽지 못했습니다: ${(r.body && r.body.error) || r.status}` };
    return { index: commentaryIndex({ listing: r.body }, game), error: "" };
  } catch (err) {
    return { index: null, error: `해설을 읽지 못했습니다: ${err.message || err}` };
  }
}

/** One commentary as HTML; every string from the record is escaped (AG3-D D12). `other` is a
 *  placed one's {tag, judged} (D8): a judged move's tag is built from escaped parts already. */
function commentaryHtml(c, k, other) {
  const tag = other && other.tag, judged = !!(other && other.judged);
  const cites = new Map();
  c.sentences.forEach((s, i) => s.cites.forEach((id) => { if (!cites.has(id)) cites.set(id, []); cites.get(id).push(i + 1); }));
  const agent = c.agent ? esc(c.agent.name || "") + (c.agent.model ? ` (${esc(c.agent.model)})` : "") : "에이전트";
  let when = "";
  if (c.created) { const t = new Date(c.created); when = isNaN(t) ? esc(c.created) : esc(t.toLocaleString("ko-KR")); }
  const head = `<div class="ai-head"><span class="tag level" title="${esc(AI_NOTE)}">출처 확인</span>` +
    `<span class="who">${agent}</span>${when ? `<span class="hint">${when}</span>` : ""}` +
    (tag ? `<span class="tag other">${judged ? tag : esc(tag)}</span>` : "") + "</div>";
  const sentences = c.sentences.map((s, i) => {
    const tags = (s.class === "interpretation" ? `<span class="tag interp">해석</span>` : "") +
      (s.by_agent ? `<span class="tag agent">에이전트 탐색</span>` : "");
    const chips = s.cites.map((id) => `<span class="chip" data-p="${esc(id)}">${esc(id)}</span>`).join("");
    return `<li class="sent ${s.class}">${tags}<span class="t">${esc(s.text)}</span> ${chips}</li>`;
  }).join("");
  const props = c.propositions.map((p, j) => {
    const by = cites.get(p.id);
    return `<li class="prop" data-p="${esc(p.id)}" data-j="${j}"><code>${esc(p.id)}</code> ${propositionLine(p)}` +
      (by ? ` <span class="hint">문장 ${by.join(", ")}</span>` : "") + "</li>";
  }).join("");
  const subject = judged && c.display && c.display.subject
    ? `<div class="ai-subject" data-k="${k}">판에 보기: ${displayMove(c.display.subject, null)}</div>` : "";
  return `<div class="ai-one" data-k="${k}">${head}${subject}<ol class="ai-sentences">${sentences}</ol>` +
    `<details class="ai-props" open><summary>확인된 명제 ${c.propositions.length}개</summary><ul>${props}</ul></details></div>`;
}

// -- the MCP App (AG3-D D9–D11, §4): JSON-RPC 2.0 over postMessage to the host, no network -------

const APP_PROTOCOL = "2026-01-26";  // MCP Apps (SEP-1865), the stable specification
const VIEWER_VERSION = "1.0.0";
const SIZE_DEBOUNCE_MS = 100;

/** show_game's arguments, kept for 「해설 새로고침」 (§4 step 2): `game` a non-empty string,
 * `plies` absent or a string, no other key; anything else is not kept (null). */
function showGameArguments(args) {
  if (!args || typeof args !== "object" || Array.isArray(args)) return null;
  if (typeof args.game !== "string" || !args.game) return null;
  if ("plies" in args && typeof args.plies !== "string") return null;
  if (Object.keys(args).some((k) => k !== "game" && k !== "plies")) return null;
  return "plies" in args ? { game: args.game, plies: args.plies } : { game: args.game };
}

/** The text blocks of a CallToolResult, joined. */
function toolText(result) {
  const content = result && Array.isArray(result.content) ? result.content : [];
  return content.filter((c) => c && c.type === "text" && typeof c.text === "string").map((c) => c.text).join("\n");
}

function calliopeDocument(result) {
  const d = result && result.structuredContent;
  return d && typeof d === "object" && d.schema === "calliope_result_v1" ? d : null;
}

/** The ply a refreshed document is shown on: the one on screen when the game still has it, else
 * the document's first ply (§4 step 3). */
function keptPly(doc, ply) {
  const n = gamePositions(doc).length;
  return Number.isInteger(ply) && ply >= 0 && ply < n ? ply : (doc.plies.length ? doc.plies[0].ply : 0);
}

/**
 * The View's side of the MCP Apps protocol (§4). `env` is the page (or a test's fake):
 * parent, post(message), onContext(hostContext), onDocument(doc, refreshed), onText(text),
 * onError(text), onState(), observe(callback) → disconnect | null, measure() → {width, height},
 * setTimer(fn, ms), clearTimer(t).
 */
function appBridge(env) {
  let nextId = 1, closed = false, args = null, refreshing = null, context = {};
  let disconnect = null, timer = null, lastSize = null, shown = null;
  const pending = new Map();  // id → {resolve, reject} of the View's own requests
  /** A document reaches the page once: after the View's own tools/call the host may also send the
   * call's result as `tool-result` (the specification's interactive phase), before or after the
   * JSON-RPC response; the same document again is not reloaded (it would reset the ply). During a
   * refresh, a document from either path keeps the ply on screen. */
  function deliver(doc, refreshed) {
    const key = JSON.stringify(doc);
    if (key === shown) return;
    shown = key;
    env.onDocument(doc, refreshed);
  }
  const send = (message) => { if (!closed) env.post(Object.assign({ jsonrpc: "2.0" }, message)); };
  const notify = (method, params) => send({ method, params });
  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => { pending.set(id, { resolve, reject }); send({ id, method, params }); });
  }
  /** A flexible container (no fixed height or no fixed width) follows the View's size (§4 step 4). */
  const flexible = () => {
    const d = context.containerDimensions;
    return !d || !("height" in d) || !("width" in d);
  };
  function resized() {
    if (closed || !flexible()) return;
    if (timer !== null) env.clearTimer(timer);
    timer = env.setTimer(() => {
      timer = null;
      if (closed) return;
      const size = env.measure();
      if (lastSize && lastSize.width === size.width && lastSize.height === size.height) return;
      lastSize = size;
      notify("ui/notifications/size-changed", { width: size.width, height: size.height });
    }, SIZE_DEBOUNCE_MS);
  }
  async function start() {
    const result = await request("ui/initialize", {
      protocolVersion: APP_PROTOCOL,
      appInfo: { name: "calliope-viewer", version: VIEWER_VERSION },
      appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
    });
    if (closed) return;
    context = Object.assign({}, result && result.hostContext);
    env.onContext(context);
    notify("ui/notifications/initialized", {});
    disconnect = env.observe ? env.observe(resized) : null;
    resized();
  }
  function teardown(id) {
    if (disconnect) disconnect();
    disconnect = null;
    if (timer !== null) env.clearTimer(timer);
    timer = null;
    pending.clear();  // replies of the View's own requests, a pending refresh's among them, are dropped
    refreshing = null;
    env.post({ jsonrpc: "2.0", id, result: {} });
    closed = true;  // after it, the page sends nothing
  }
  function answer(m) {
    if (m.method === "ui/resource-teardown") teardown(m.id);
    else if (m.method === "ping") send({ id: m.id, result: {} });
    else send({ id: m.id, error: { code: -32601, message: `method not found: ${m.method}` } });
  }
  function notification(method, params) {
    if (method === "ui/notifications/tool-input") {
      args = showGameArguments(params.arguments);
      env.onState();
    } else if (method === "ui/notifications/tool-result") {
      const doc = calliopeDocument(params);
      if (doc) deliver(doc, !!refreshing);
      else env.onText(toolText(params) || "Calliope 결과가 아닙니다.");
    } else if (method === "ui/notifications/tool-cancelled") {
      env.onText("취소되었습니다");
    } else if (method === "ui/notifications/host-context-changed") {
      Object.assign(context, params);
      env.onContext(context);
      resized();
    }  // tool-input-partial and unknown notifications: ignored
  }
  function receive(event) {
    if (closed || !event || event.source !== env.parent) return;  // only the host's window
    const m = event.data;
    if (!m || typeof m !== "object" || m.jsonrpc !== "2.0") return;
    const hasId = m.id !== undefined && m.id !== null;
    if (typeof m.method === "string") {
      if (hasId) answer(m);
      else notification(m.method, m.params && typeof m.params === "object" ? m.params : {});
    } else if (hasId && pending.has(m.id)) {
      const reply = pending.get(m.id);
      pending.delete(m.id);
      if (m.error) reply.reject(new Error(String((m.error && m.error.message) || "host error")));
      else reply.resolve(m.result);
    }
  }
  /** 「해설 새로고침」: show_game again with the kept arguments; one call at a time (§4 step 3). */
  async function refresh() {
    if (closed || !args || refreshing) return false;
    const call = request("tools/call", { name: "show_game", arguments: args });
    refreshing = call;
    env.onState();
    try {
      const result = await call;
      const doc = calliopeDocument(result);
      if (result && result.isError) env.onError(toolText(result) || "show_game이 오류를 돌려주었습니다.");
      else if (doc) deliver(doc, true);
      else env.onError(toolText(result) || "Calliope 결과가 아닙니다.");
    } catch (err) {
      env.onError(String(err.message || err));
    } finally {
      if (refreshing === call) { refreshing = null; env.onState(); }
    }
    return true;
  }
  return {
    start, receive, refresh,
    canRefresh: () => !closed && !!args && !refreshing,
    refreshing: () => !!refreshing,
    closed: () => closed,
  };
}

const CalliopeViewer = { parsePlacement, applyUci, gamePositions, refFrames, segmentFrames, lineText,
                         scoreText, scoreValue, boardSvg, numbered, esc, placementKey,
                         normalizedPath, serverClient, pollJob, progressText, durationText, gameTitle,
                         readableCommentary, propositionLine, propositionFrames, commentaryIndex, commentaryHtml,
                         fetchCommentary, AI_NOTE, appBridge, showGameArguments, toolText, keptPly,
                         APP_PROTOCOL, VIEWER_VERSION, SIZE_DEBOUNCE_MS };
if (typeof globalThis !== "undefined") globalThis.CalliopeViewer = CalliopeViewer;

// -- the page ----------------------------------------------------------------------------------

if (typeof document !== "undefined") {
  const state = { doc: null, positions: [], plies: new Map(), ply: 0, flipped: false, preview: null,
                  ai: { server: null, index: null, error: "", pending: false, shown: [] } };
  const $ = (id) => document.getElementById(id);
  let app = null;  // the MCP App bridge (AG3-D D9), when the page carries #calliope-app

  /** `ply`: the ply to show (a refreshed document keeps the one on screen, §4 step 3). */
  function load(doc, name, ply) {
    if (!doc || doc.schema !== "calliope_result_v1") throw new Error("calliope_result_v1 문서가 아닙니다.");
    state.doc = doc;
    state.positions = gamePositions(doc);
    state.plies = new Map(doc.plies.map((p) => [p.ply, p]));
    state.ply = keptPly(doc, ply);
    state.preview = null;
    state.ai = { server: null, index: commentaryIndex({ doc }, doc.game), error: "", pending: false, shown: [] };
    $("filename").textContent = name || "";
    layout();
    render();
  }

  function layout() {
    $("app").innerHTML = `
      <div class="left">
        <div class="panel players" id="top"></div>
        <div class="panel" id="preview" hidden></div>
        <div class="board-wrap"><div id="evalbar" title="평가 (백 기준)"></div><div id="board"></div></div>
        <div class="panel players" id="bottom"></div>
        <div class="controls">
          <button id="first" title="처음 (Home)">⏮</button><button id="prev" title="이전 (←)">◀</button>
          <button id="next" title="다음 (→)">▶</button><button id="last" title="끝 (End)">⏭</button>
          <button id="flip" title="판 뒤집기 (F)">⇅</button>
        </div>
        <div class="panel" id="graph"></div>
      </div>
      <div class="right">
        <div class="panel" id="ply"></div>
        <div class="panel" id="ai" hidden></div>
        <div class="panel" id="moves"></div>
        <div class="panel" id="summary"></div>
        <div class="panel" id="meta"></div>
      </div>`;
    $("first").onclick = () => go(0);
    $("prev").onclick = () => go(state.ply - 1);
    $("next").onclick = () => go(state.ply + 1);
    $("last").onclick = () => go(state.positions.length - 1);
    $("flip").onclick = () => { state.flipped = !state.flipped; renderBoard(); renderEvalBar(); renderPlayers(); };
    $("graph").onclick = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const n = state.doc.game.moves.length;
      go(Math.round(((e.clientX - r.left) / r.width) * n));
    };
    renderMoves(); renderSummary(); renderMeta();
  }

  function go(ply) {
    const n = state.positions.length - 1;
    state.ply = Math.max(0, Math.min(n, ply));
    state.preview = null;
    render();
    keepMoveVisible();
  }

  function render() { renderPlayers(); renderBoard(); renderEvalBar(); renderPly(); renderAi(); renderGraph(); markCurrent(); }

  /** The bar beside the board: White's share from the bottom (from the top when flipped). */
  function renderEvalBar() {
    const p = state.plies.get(state.ply);
    const score = p && p.evaluation && p.evaluation.played;
    const share = score ? (scoreValue(score) + 1) / 2 : 0.5;
    const white = !score || share >= 0.5;
    const text = score ? scoreText(score).replace(/^[+−]/, "") : (state.ply ? "–" : "");
    // the number sits on the side that is ahead, at the bar's end on that side
    const atBottom = white !== state.flipped;
    const pos = atBottom ? "bottom: 3px" : "top: 3px";
    const color = white ? "var(--eval-on-white)" : "var(--eval-on-black)";
    const bar = $("evalbar");
    bar.classList.toggle("flipped", state.flipped);
    bar.innerHTML = `<div class="fill" style="height:${(share * 100).toFixed(1)}%"></div>` +
      `<div class="num" style="${pos}; color:${color}">${esc(text)}</div>`;
    bar.title = score ? `평가 ${scoreText(score)} (백 기준)` : "평가 없음";
  }

  function renderPlayers() {
    const h = state.doc.game.headers;
    const one = (side) => `<div class="player"><span class="dot" style="background:${side === "white" ? "#fafafa" : "#1b1b1b"}"></span>` +
      `<span class="name">${esc(h[side] || (side === "white" ? "백" : "흑"))}</span>` +
      (h[side + "_rating"] ? `<span class="rating">(${h[side + "_rating"]})</span>` : "") + "</div>";
    const [top, bottom] = state.flipped ? ["white", "black"] : ["black", "white"];
    $("top").innerHTML = one(top) + `<span class="hint">${esc(h.result || "")}</span>`;
    $("bottom").innerHTML = one(bottom) + `<span class="hint">${esc([h.time_control, h.date].filter(Boolean).join(" · "))}</span>`;
  }

  function renderBoard() {
    const pv = state.preview;
    let svg;
    if (pv) {
      const f = pv.frames[pv.i];
      svg = boardSvg(f.board, { flipped: state.flipped, rings: f.rings, arrows: f.arrows });
      const steps = pv.frames.length > 1
        ? `<button id="pv-prev" ${pv.i === 0 ? "disabled" : ""}>◀</button><span class="hint">${pv.i + 1}/${pv.frames.length}</span>` +
          `<button id="pv-next" ${pv.i === pv.frames.length - 1 ? "disabled" : ""}>▶</button>` : "";
      $("preview").innerHTML = `<span class="caption">${f.caption}</span>${steps}<button id="pv-close" title="닫기 (Esc)">✕</button>`;
      $("preview").hidden = false;
      if ($("pv-prev")) $("pv-prev").onclick = () => step(-1);
      if ($("pv-next")) $("pv-next").onclick = () => step(1);
      $("pv-close").onclick = clearPreview;
    } else {
      const m = state.doc.game.moves[state.ply - 1];
      svg = boardSvg(state.positions[state.ply], { flipped: state.flipped, last: m ? [m.uci.slice(0, 2), m.uci.slice(2, 4)] : null });
      $("preview").hidden = true;
    }
    $("board").innerHTML = svg;
  }

  function badge(kind, info, provisional) {
    return `<span class="badge${provisional ? " provisional" : ""}" style="background:var(--${kind})">${esc(info.sym)} ${esc(info.ko)}</span>`;
  }

  function renderPly() {
    const el = $("ply");
    if (state.ply === 0) {
      el.innerHTML = `<h2>시작 위치</h2><div class="hint">▶ 버튼이나 기보를 눌러 수를 보세요. 해설에서 밑줄 친 부분을 누르면 판에 표시됩니다.</div>`;
      return;
    }
    const move = state.doc.game.moves[state.ply - 1];
    const p = state.plies.get(state.ply);
    const fen = p ? p.fen_before : null;
    const title = fen ? numbered(fen, move.san) : move.san;
    if (!p) {
      el.innerHTML = `<h2>${esc(title)}</h2><div class="hint">이 수는 분석되지 않았습니다.</div>`;
      return;
    }
    let head = `<h2>${esc(title)} `;
    if (p.grade) head += badge(p.grade, GRADES[p.grade]);
    if (p.label) head += badge(p.label.kind, LABELS[p.label.kind], p.label.provisional);
    head += "</h2>";
    const ev = p.evaluation;
    let evline = "";
    if (ev && ev.played && ev.best_move && ev.best_move.uci !== p.uci) {  // the number itself is in the bar
      evline = `<div class="evalline">둔 수 <b>${scoreText(ev.played)}</b> · 최선 ` +
        `<b>${esc(numbered(p.fen_before, ev.best_move.san))}</b> <b>${scoreText(ev.best)}</b></div>`;
    } else if (p.status === "inconclusive") {
      evline = `<div class="evalline">판정 보류: ${esc(p.reason || "")}</div>`;
    }
    const segs = p.segments.map((s, i) => {
      const cls = ["seg", s.source, s.refs.length ? "has-refs" : ""].join(" ");
      return `<span class="${cls}" data-i="${i}">${esc(s.text)}</span>`;
    }).join("");
    const claims = p.claims.map((c) => `<li>${esc(c.template)} — ${esc(c.role)}, ${esc(c.status)}${c.rendered ? " (본문)" : ""}</li>`).join("");
    el.innerHTML = head + `<div id="text">${segs}</div>` + evline +
      `<div class="hint">밑줄 친 부분: 마우스를 올리면 미리보기, 누르면 고정 (Esc로 해제)</div>` +
      (claims ? `<details class="claims"><summary>근거 주장 ${p.claims.length}개</summary><ul>${claims}</ul></details>` : "");
    el.querySelectorAll(".seg.has-refs").forEach((span) => {
      const seg = p.segments[Number(span.dataset.i)];
      span.onmouseenter = () => { if (!state.preview || !state.preview.pinned) setPreview(seg, span, false); };
      span.onmouseleave = () => { if (state.preview && !state.preview.pinned) clearPreview(); };
      span.onclick = () => {
        if (state.preview && state.preview.pinned && state.preview.span === span) clearPreview();
        else setPreview(seg, span, true);
      };
    });
  }

  function setPreview(seg, span, pinned) { showFrames(segmentFrames(seg.refs), span, pinned); }

  function showFrames(frames, el, pinned) {
    if (!frames.length) return;
    document.querySelectorAll(".active").forEach((x) => x.classList.remove("active"));
    el.classList.add("active");
    state.preview = { frames, i: 0, pinned, span: el };
    renderBoard();
  }

  function clearPreview() {
    document.querySelectorAll(".active").forEach((x) => x.classList.remove("active"));
    state.preview = null;
    renderBoard();
  }

  /** Hover previews, a click pins, a second click (or Esc) clears — as Calliope's segments. */
  function previewOn(el, frames) {
    if (!frames.length) return;
    el.classList.add("has-frames");
    el.onmouseenter = () => { if (!state.preview || !state.preview.pinned) showFrames(frames, el, false); };
    el.onmouseleave = () => { if (state.preview && !state.preview.pinned) clearPreview(); };
    el.onclick = (e) => {
      e.stopPropagation();
      if (state.preview && state.preview.pinned && state.preview.span === el) clearPreview();
      else showFrames(frames, el, true);
    };
  }

  // -- the AI commentary panel (AG3-D D1–D8) ------------------------------------------------------

  function renderAi() {
    const el = $("ai"), ai = state.ai;
    if (!el) return;
    const index = ai.index;
    if (!ai.server && !app && !(index && index.any)) { el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    const here = index ? index.plies.get(state.ply) : null;
    ai.shown = [];
    const one = (c, other) => { ai.shown.push(c); return commentaryHtml(c, ai.shown.length - 1, other); };
    let body = "";
    if (here && here.main) body += one(here.main);
    else if ((ai.server || app) && index) body += `<div class="hint">이 수의 AI 해설이 없습니다.</div>`;
    if (here && here.others.length) {
      body += `<details class="ai-others"><summary>다른 해설 ${here.others.length}개</summary>` +
        here.others.map((o) => one(o.c, o)).join("") + "</details>";
    }
    if (index && index.offGame.length) {
      body += `<details class="ai-offgame"><summary>본선 밖 해설 ${index.offGame.length}개</summary>` +
        index.offGame.map((o) => one(o.c, o)).join("") + "</details>";
    }
    const refresh = ai.server ? `<button id="ai-refresh" ${ai.pending ? "disabled" : ""}>해설 새로고침</button>`
      : app ? `<button id="ai-refresh" ${app.canRefresh() ? "" : "disabled"}>해설 새로고침</button>` : "";
    el.innerHTML = `<div class="ai-top"><h2>AI 해설</h2>${refresh}</div>` +
      (ai.error ? `<div class="error">${esc(ai.error)}</div>` : "") +
      (ai.server && !index && !ai.error ? `<div class="hint">해설을 불러오는 중…</div>` : "") +
      (body ? `<div class="hint">${esc(AI_NOTE)}</div>` + body : "");
    if ($("ai-refresh")) {
      $("ai-refresh").onclick = () => {
        if (ai.server) { loadCommentary(ai.server); return; }
        if (!app.canRefresh()) return;
        ai.error = "";
        app.refresh();
      };
    }
    el.querySelectorAll(".ai-one").forEach((box) => {
      const c = ai.shown[Number(box.dataset.k)];
      box.querySelectorAll(".prop").forEach((li) => previewOn(li, propositionFrames(c.propositions[Number(li.dataset.j)])));
      box.querySelectorAll(".chip").forEach((chip) => {
        const props = [...box.querySelectorAll(".prop")].filter((li) => li.dataset.p === chip.dataset.p);
        chip.onmouseenter = () => props.forEach((li) => li.classList.add("hl"));
        chip.onmouseleave = () => props.forEach((li) => li.classList.remove("hl"));
        const p = c.propositions.find((x) => x.id === chip.dataset.p);
        if (p) previewOn(chip, propositionFrames(p));
      });
      const subject = box.querySelector(".ai-subject");
      if (subject && c.display) previewOn(subject, propositionFrames({ kind: "engine_score", display: c.display.subject }));
    });
  }

  /** Server mode (D1): the listing route, fetched after the result and on 「해설 새로고침」. */
  async function loadCommentary(id) {
    const ai = state.ai;
    ai.server = id;
    ai.pending = true;
    renderAi();
    const got = await fetchCommentary(client, id, state.doc.game);
    if (state.ai !== ai) return;  // another document was loaded meanwhile
    if (got.index) ai.index = got.index;  // on an error the panel keeps what it showed
    ai.error = got.error;
    ai.pending = false;
    renderAi();
  }

  function step(d) {
    const pv = state.preview;
    pv.i = Math.max(0, Math.min(pv.frames.length - 1, pv.i + d));
    pv.pinned = true;
    renderBoard();
  }

  function symbolOf(p) {
    if (!p) return "";
    if (p.label) return `<span class="sym" style="color:var(--${p.label.kind})">${esc(LABELS[p.label.kind].sym)}</span>`;
    if (p.grade && p.grade !== "best" && p.grade !== "excellent" && p.grade !== "good")
      return `<span class="sym" style="color:var(--${p.grade})">${esc(GRADES[p.grade].sym)}</span>`;
    return "";
  }

  function renderMoves() {
    const moves = state.doc.game.moves;
    let { white, fullmove } = fenMover(state.doc.game.start_fen);
    const rows = [];
    let row = null;
    moves.forEach((m, i) => {
      const ply = i + 1, p = state.plies.get(ply);
      const cell = `<span class="mv${p ? "" : " unanalysed"}" data-ply="${ply}">${esc(m.san)}${symbolOf(p)}</span>`;
      if (white || !row) { row = { no: fullmove, w: white ? cell : "…", b: "" }; rows.push(row); if (!white) row.b = cell; }
      else row.b = cell;
      if (!white) fullmove += 1;
      white = !white;
    });
    $("moves").innerHTML = `<table>${rows.map((r) => `<tr><td class="no">${r.no}.</td><td>${r.w}</td><td>${r.b}</td></tr>`).join("")}</table>`;
    $("moves").querySelectorAll(".mv").forEach((el) => { el.onclick = () => go(Number(el.dataset.ply)); });
  }

  /** Scroll the move list's own box to the current move; the page itself never moves
   *  (scrollIntoView also scrolled the page, by an amount that followed the text's length). */
  function keepMoveVisible() {
    const box = $("moves"), cur = box.querySelector(".mv.current");
    if (!cur) return;
    const r = cur.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (r.top < b.top || r.bottom > b.bottom) box.scrollTop += r.top - b.top - (box.clientHeight - r.height) / 2;
  }

  function markCurrent() {
    document.querySelectorAll("#moves .mv").forEach((el) => el.classList.toggle("current", Number(el.dataset.ply) === state.ply));
  }

  function renderGraph() {
    const n = state.doc.game.moves.length || 1, W = 600, H = 110, mid = H / 2;
    const pts = [];
    for (let ply = 1; ply <= n; ply++) {
      const p = state.plies.get(ply);
      pts.push(p && p.evaluation && p.evaluation.played ? [ply, scoreValue(p.evaluation.played), p] : null);
    }
    const x = (ply) => (ply / n) * W, y = (v) => mid - v * (mid - 4);
    let area = "", line = "", marks = "";
    let run = [];
    const flush = () => {
      if (run.length) {
        const d = run.map(([ply, v], k) => `${k ? "L" : "M"}${x(ply).toFixed(1)},${y(v).toFixed(1)}`).join("");
        area += `<path d="${d}L${x(run[run.length - 1][0]).toFixed(1)},${H}L${x(run[0][0]).toFixed(1)},${H}Z" fill="var(--eval-white)"/>`;
        line += `<path d="${d}" fill="none" stroke="var(--eval-line)" stroke-width="1.2"/>`;
      }
      run = [];
    };
    for (const pt of pts) { if (pt) run.push(pt); else flush(); }
    flush();
    for (const pt of pts) {
      if (!pt) continue;
      const [ply, v, p] = pt;
      const kind = p.label ? p.label.kind : (["inaccuracy", "mistake", "blunder"].includes(p.grade) ? p.grade : null);
      if (kind) marks += `<circle cx="${x(ply).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.6" fill="var(--${kind})" stroke="var(--panel)" stroke-width="1"/>`;
    }
    const cur = `<line x1="${x(state.ply).toFixed(1)}" x2="${x(state.ply).toFixed(1)}" y1="0" y2="${H}" stroke="var(--accent)" stroke-width="1.5"/>`;
    $("graph").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="평가 그래프">` +
      `<rect width="${W}" height="${H}" fill="var(--eval-black)"/>${area}${line}` +
      `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--eval-line)" stroke-dasharray="3 3" stroke-width="0.8"/>${cur}${marks}</svg>`;
  }

  function renderSummary() {
    const s = state.doc.summary;
    const cols = [...Object.keys(GRADES).map((g) => [g, GRADES[g], "grades"]), ...Object.keys(LABELS).map((k) => [k, LABELS[k], "labels"])];
    const head = cols.map(([k, info]) => `<th title="${esc(info.ko)}" style="color:var(--${k})">${esc(info.sym)}</th>`).join("");
    const row = (side) => `<tr><td>${side === "white" ? "백" : "흑"}</td>` +
      cols.map(([k, , group]) => `<td>${(s[side][group] || {})[k] || 0}</td>`).join("") + `<td>${s[side].inconclusive}</td></tr>`;
    $("summary").innerHTML = `<table><tr><th></th>${head}<th title="판정 보류">…</th></tr>${row("white")}${row("black")}</table>`;
  }

  function renderMeta() {
    const d = state.doc, pr = d.provenance, g = d.grading;
    let curve = g.policy;
    if (g.curve) {
      curve += ` · ${g.curve.model}`;
      if (g.curve.source === "table") curve += ` (${g.curve.table}, ${g.curve.time_class} ${g.curve.band}${g.curve.clamped ? ", clamped" : ""})`;
      else curve += ` (scale ${g.curve.scale})`;
    }
    const warn = g.fallback ? `<div class="warn">레이팅·시간 형식이 없어 기본 곡선으로 채점했습니다.</div>` : "";
    const analysed = d.plies.length, total = d.game.moves.length;
    $("meta").innerHTML = warn +
      `엔진 ${esc(pr.engine.name)} · ${esc(pr.engine.profile.name)} (depth ${pr.engine.profile.depth}, multipv ${pr.engine.profile.multipv})<br>` +
      `채점 ${esc(curve)} · 라벨 ${esc(Object.values(pr.label_rules).join(", "))}<br>` +
      `분석 ${analysed}/${total} 플라이 · 빌드 ${esc(pr.build_digest.slice(0, 12))} · ${esc(pr.phrasebook.name)}`;
  }

  // -- input -------------------------------------------------------------------------------------

  function showError(err) {
    const box = $("error");
    if (box) box.textContent = String(err.message || err);
    else alert(String(err.message || err));
  }

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = () => { try { load(JSON.parse(reader.result), file.name); } catch (err) { showError(err); } };
    reader.onerror = () => showError(reader.error || new Error("파일을 읽지 못했습니다."));
    reader.readAsText(file);
  }

  $("file").onchange = (e) => { if (e.target.files[0]) readFile(e.target.files[0]); };
  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drop"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("drop"); });
  document.addEventListener("drop", (e) => {
    e.preventDefault(); document.body.classList.remove("drop");
    if (app) return;  // no file picker in the App (D11)
    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (/\.pgn$/i.test(file.name) && $("pgn")) {  // a PGN dropped on the analyse panel
      file.text().then((t) => { $("pgn").value = t; });
    } else {
      readFile(file);
    }
  });
  document.addEventListener("keydown", (e) => {
    if (!state.doc || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    const pv = state.preview;
    if (e.key === "Escape" && pv) clearPreview();
    else if (e.key === "ArrowLeft") pv && pv.pinned && pv.frames.length > 1 ? step(-1) : go(state.ply - 1);
    else if (e.key === "ArrowRight") pv && pv.pinned && pv.frames.length > 1 ? step(1) : go(state.ply + 1);
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(state.positions.length - 1);
    else if (e.key === "f" || e.key === "F") { state.flipped = !state.flipped; renderBoard(); renderEvalBar(); renderPlayers(); }
    else return;
    e.preventDefault();
  });

  const themes = [null, "light", "dark"];
  let theme = 0;
  try { theme = Math.max(0, themes.indexOf(localStorage.getItem("calliope-theme"))); } catch (_) { /* no storage */ }
  const applyTheme = () => {
    if (themes[theme]) document.documentElement.dataset.theme = themes[theme];
    else delete document.documentElement.dataset.theme;
    $("theme").textContent = ["테마: 자동", "테마: 밝게", "테마: 어둡게"][theme];
  };
  $("theme").onclick = () => {
    theme = (theme + 1) % themes.length;
    try { localStorage.setItem("calliope-theme", themes[theme] || ""); } catch (_) { /* no storage */ }
    applyTheme();
  };
  applyTheme();

  // -- the analysis server (AS2) -----------------------------------------------------------------

  const client = serverClient((url, init) => fetch(url, init));
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  let polling = 0;  // a newer job view stops an older poll

  function setGameParam(id) {
    const url = new URL(location.href);
    if (id) url.searchParams.set("game", id); else url.searchParams.delete("game");
    history.replaceState(null, "", url.search ? url.search : url.pathname);
  }

  function showAnalysePanel(games) {
    $("new").hidden = false;
    state.doc = null;
    $("filename").textContent = "";
    const rows = games.map((g) => `<tr class="game" data-id="${esc(g.id)}"><td>${esc(gameTitle(g.game))}</td>` +
      `<td class="state">${esc(progressText(g))}</td></tr>`).join("");
    $("app").innerHTML = `
      <section id="analyse" class="panel">
        <h2>기보 분석</h2>
        <textarea id="pgn" placeholder="PGN을 붙여넣으세요 (chess.com의 공유 → PGN 복사)" spellcheck="false"></textarea>
        <div class="row">
          <label class="button" for="pgnfile">PGN 파일 선택</label>
          <input type="file" id="pgnfile" accept=".pgn,text/plain,application/x-chess-pgn">
          <input type="text" id="plies" placeholder="수 범위 (예: 1-40)" inputmode="numeric">
          <button id="go" class="primary">분석 시작</button>
        </div>
        <div class="hint">비워 두면 모든 수를 분석합니다. 한 게임에 몇 분 걸리며, 이미 분석한 수는 바로 나옵니다.</div>
        <div id="post-error" class="error"></div>
        ${rows ? `<h2>지난 분석</h2><table id="games">${rows}</table>` : ""}
      </section>`;
    $("pgnfile").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { $("pgn").value = reader.result; };
      reader.readAsText(file);
    };
    $("go").onclick = submit;
    document.querySelectorAll("#games tr.game").forEach((tr) => { tr.onclick = () => openJob(tr.dataset.id); });
  }

  async function submit() {
    const pgn = $("pgn").value.trim(), plies = $("plies").value.trim();
    if (!pgn) { $("post-error").textContent = "PGN을 붙여넣거나 파일을 고르세요."; return; }
    $("go").disabled = true;
    $("post-error").textContent = "";
    try {
      const r = await client.post(pgn, plies);
      if (!r.ok) throw new Error((r.body && r.body.error) || `요청이 거부되었습니다 (${r.status})`);
      openJob(r.body.id, r.body);
    } catch (err) {
      $("post-error").textContent = String(err.message || err);
      $("go").disabled = false;
    }
  }

  function renderJob(status) {
    const p = status.plies || {};
    const share = p.total ? (100 * p.done) / p.total : 0;
    const warnings = (status.warnings || []).map((w) => `<div class="warn">${esc(w)}</div>`).join("");
    $("app").innerHTML = `
      <section id="job" class="panel">
        <h2>${esc(gameTitle(status.game))}</h2>
        <div class="bar"><div style="width:${share.toFixed(1)}%"></div></div>
        <div id="job-text" class="${status.state === "failed" ? "error" : ""}">${esc(progressText(status))}</div>
        ${warnings}
        <div><a class="button" href="./">새 분석</a></div>
      </section>`;
  }

  async function openJob(id, first) {
    const mine = ++polling;
    setGameParam(id);
    $("new").hidden = false;
    if (first) renderJob(first);
    try {
      const last = await pollJob(client, id, (s) => { if (mine === polling) renderJob(s); },
                                 (ms) => sleep(ms).then(() => { if (mine !== polling) throw new Error("stopped"); }));
      if (mine !== polling || last.state !== "done") return;
      const r = await client.result(id);
      if (!r.ok) throw new Error((r.body && r.body.error) || `결과를 읽지 못했습니다 (${r.status})`);
      load(r.body, gameTitle(last.game));
      loadCommentary(id);
    } catch (err) {
      if (mine === polling && String(err.message) !== "stopped") {
        $("app").innerHTML = `<section id="job" class="panel"><div class="error">${esc(err.message || err)}</div>` +
          `<div><a class="button" href="./">새 분석</a></div></section>`;
      }
    }
  }

  // -- the MCP App (AG3-D D9–D11): the host's messages instead of the HTTP API ----------------------

  /** A message of the host (a non-Calliope result, a refusal, a cancellation): the AI panel's error
   * line once a document is on screen, else the empty panel's. */
  function appMessage(text) {
    if (state.doc) { state.ai.error = String(text); renderAi(); }
    else showError(new Error(String(text)));
  }

  function applyHostContext(ctx) {
    if (ctx.theme === "light" || ctx.theme === "dark") document.documentElement.dataset.theme = ctx.theme;
    const d = ctx.containerDimensions || {};
    const root = document.documentElement.style;
    root.height = "height" in d ? "100vh" : "";  // a fixed container: fill it
    root.maxHeight = !("height" in d) && d.maxHeight ? `${d.maxHeight}px` : "";
    root.width = "width" in d ? "100vw" : "";
    root.maxWidth = !("width" in d) && d.maxWidth ? `${d.maxWidth}px` : "";
  }

  function startApp() {
    document.body.classList.add("mcp-app");
    $("empty").innerHTML = `<p>Calliope 결과를 기다리는 중…</p><p id="error"></p>`;
    app = appBridge({
      parent: window.parent,
      post: (message) => window.parent.postMessage(message, "*"),
      onContext: applyHostContext,
      onDocument: (doc, refreshed) => {
        try {
          load(doc, gameTitle(doc.game.headers), refreshed ? state.ply : undefined);
        } catch (err) { appMessage(err.message || err); }
      },
      onText: appMessage,
      onError: appMessage,
      onState: () => renderAi(),
      observe: (callback) => {
        if (typeof ResizeObserver === "undefined") return null;
        const observer = new ResizeObserver(() => callback());
        observer.observe(document.body);
        return () => observer.disconnect();
      },
      measure: () => {
        const r = document.body.getBoundingClientRect();
        return { width: Math.ceil(r.width), height: Math.ceil(r.height) };
      },
      setTimer: (fn, ms) => setTimeout(fn, ms),
      clearTimer: (t) => clearTimeout(t),
    });
    window.addEventListener("message", (e) => app.receive(e));
    app.start().catch((err) => appMessage(err.message || err));
  }

  const embedded = document.getElementById("calliope-doc");  // a page built with its document
  const params = new URLSearchParams(location.search);
  const param = params.get("file"), game = params.get("game");
  const fix = location.protocol.startsWith("http") ? normalizedPath(location.pathname) : null;
  if (document.getElementById("calliope-app")) {
    startApp();  // inside an MCP host: no redirect, no file, no server
  } else if (fix) {
    location.replace(fix + location.search + location.hash);  // relative URLs need the trailing "/"
  } else if (embedded) {
    try { load(JSON.parse(embedded.textContent), embedded.dataset.name || ""); } catch (err) { showError(err); }
  } else if (param) {
    fetch(param).then((r) => { if (!r.ok) throw new Error(`${param}: ${r.status}`); return r.json(); })
      .then((doc) => load(doc, param)).catch(showError);
  } else if (game) {
    openJob(game);
  } else if (location.protocol.startsWith("http")) {
    client.list().then((r) => { if (r.ok && r.body && Array.isArray(r.body.games)) showAnalysePanel(r.body.games); })
      .catch(() => { /* a static server without the API: the page stays as it is */ });
  }
}
</script>
</body>
</html>
